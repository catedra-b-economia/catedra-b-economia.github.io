# Configuración del panel de administración (Pages CMS: https://app.pagescms.org)
# Cada cambio que se guarda desde el panel es un commit en GitHub, y Netlify publica solo.
components:
  pregunta:
    type: object
    label: Pregunta
    fields:
      - { name: texto, label: Pregunta, type: text, required: true }
      - { name: opciones, label: Opciones de esta pregunta, type: string, list: true, description: "Dejalo vacío si la pregunta usa las opciones comunes de la actividad." }
      - { name: correcta, label: Número de la opción correcta, type: number, required: true, options: { min: 1 }, description: "La primera opción es 1, la segunda 2, etc." }
      - { name: explicacion, label: Explicación (se muestra al responder), type: text }
  pregunta-fija:
    type: object
    label: Pregunta
    fields:
      - { name: texto, label: Pregunta, type: text, required: true }
      - { name: correcta, label: Respuesta correcta, type: number, required: true, options: { min: 1, max: 2 } }
      - { name: explicacion, label: Explicación (se muestra al responder), type: text }
content:
  - name: config
    label: "⚙ Unidades y actividades"
    type: file
    path: contenido/config.json
    format: json
    description: "Qué unidades están habilitadas, y qué actividades se ven en cada una (arrastrá para cambiar el orden)."
    fields:
      - name: curso
        label: Curso
        type: object
        fields:
          - { name: nombre, label: Nombre (título grande de la portada), type: string }
          - { name: docente, label: Docente (texto chico arriba del título), type: string }
      - name: unidades
        label: Unidades
        type: object
        list: { min: 5, max: 5, collapsible: { collapsed: true, summary: "Unidad {fields.id} · {fields.nombre}" } }
        fields:
          - { name: id, label: Número, type: string, readonly: true }
          - { name: nombre, label: Nombre, type: string }
          - { name: habilitada, label: "Habilitada (si se destilda, se ve como Próximamente)", type: boolean, default: true }
          - name: actividades
            label: Actividades
            type: object
            list: { collapsible: { collapsed: true, summary: "{fields.titulo}" } }
            description: "Destildá Visible para ocultar una actividad. No cambies el código interno."
            fields:
              - { name: id, label: Código interno, type: string, readonly: true }
              - { name: titulo, label: Título, type: string }
              - { name: descripcion, label: Descripción, type: string }
              - { name: visible, label: Visible, type: boolean, default: true }
  - name: nuevas
    label: "➕ Actividades nuevas"
    type: file
    path: contenido/actividades-nuevas.json
    format: json
    description: "Cuestionarios nuevos de opción múltiple. Aparecen al final de la unidad elegida."
    fields:
      - name: actividades
        label: Actividades
        type: object
        list: { collapsible: { collapsed: true, summary: "Unidad {fields.unidad} · {fields.titulo}" } }
        fields:
          - { name: unidad, label: Unidad, type: select, required: true, options: { values: [I, II, III, IV, V] } }
          - { name: titulo, label: Título, type: string, required: true }
          - { name: descripcion, label: Descripción corta, type: string }
          - { name: visible, label: Visible, type: boolean, default: true }
          - { name: mezclar_preguntas, label: Mezclar el orden de las preguntas, type: boolean, default: true }
          - { name: mezclar_opciones, label: Mezclar el orden de las opciones, type: boolean, default: false }
          - { name: opciones_comunes, label: Opciones comunes, type: string, list: true, description: "Opcional: si todas las preguntas tienen las mismas opciones (ej. Verdadero / Falso), ponelas acá una sola vez." }
          - name: preguntas
            label: Preguntas
            component: pregunta
            list: { collapsible: { collapsed: true, summary: "{index}. {fields.texto}" } }
  - name: glosario
    label: "📖 Glosario"
    type: file
    path: contenido/glosario.json
    format: json
    description: "Términos del glosario. La actividad es el código interno de la actividad (lo ves en Unidades y actividades); si queda vacía, el término no lleva el link Practicalo."
    fields:
      - name: terminos
        label: Términos
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.termino} (Unidad {fields.unidad})" } }
        fields:
          - { name: termino, label: Término, type: string, required: true }
          - { name: definicion, label: Definición, type: text, required: true }
          - { name: unidad, label: Unidad, type: select, options: { values: [I, II, III, IV, V] } }
          - { name: actividad, label: Código de la actividad para practicar, type: string }
  - name: dudas
    label: "💬 Preguntas de la comisión"
    type: file
    path: contenido/dudas.json
    format: json
    description: "Dudas respondidas. Aparecen al final de la lista de actividades de su unidad."
    fields:
      - name: dudas
        label: Dudas
        type: object
        list: { collapsible: { collapsed: true, summary: "Unidad {fields.unidad} · {fields.pregunta}" } }
        fields:
          - { name: unidad, label: Unidad, type: select, required: true, options: { values: [I, II, III, IV, V] } }
          - { name: pregunta, label: Pregunta, type: text, required: true }
          - { name: respuesta, label: Respuesta, type: text, required: true }

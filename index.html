    fmt: v => v + "%"
  }, {
    k: "G",
    label: "Gasto público (G)",
    min: 15,
    max: 45,
    fmt: v => v + "%"
  } ],
  dibujar(v) {
    const priv = v.S - v.I, pub = v.T - v.G, ext = -(priv + pub);
    const col = x => x > 0 ? "var(--verde)" : x < 0 ? "var(--rojo)" : "var(--ink-soft)";
    const et = x => (x > 0 ? "+" : "") + fmt(x);
    const g = grafico({
      H: 220,
      xmin: .3,
      xmax: 3.7,
      ymin: -25,
      ymax: 25,
      ylabel: "% del PIB",
      yticks: [ -20, 0, 20 ],
      barras: [ {
        x: 1,
        y: priv,
        ancho: .6,
        color: col(priv),
        etiqueta: et(priv),
        abajo: "Privado (S − I)"
      }, {
        x: 2,
        y: pub,
        ancho: .6,
        color: col(pub),
        etiqueta: et(pub),
        abajo: "Público (T − G)"
      }, {
        x: 3,
        y: ext,
        ancho: .6,
        color: col(ext),
        etiqueta: et(ext),
        abajo: "Externo (M − X)"
      } ]
    });
    const frases = [];
    if (pub < 0) frases.push(`El Estado tiene un <strong>déficit de ${fmt(-pub)}%</strong> del PIB`); else if (pub > 0) frases.push(`El Estado tiene un <strong>superávit de ${fmt(pub)}%</strong> del PIB`); else frases.push(`Las cuentas públicas están equilibradas`);
    if (ext > 0) frases.push(`el país tiene un <strong>déficit de cuenta corriente de ${fmt(ext)}%</strong>: el resto del mundo le está prestando`); else if (ext < 0) frases.push(`el país tiene un <strong>superávit de cuenta corriente de ${fmt(-ext)}%</strong>: le está prestando al resto del mundo`); else frases.push(`la cuenta corriente está equilibrada`);
    let rotulo = "";
    if (pub < 0 && ext > 0) rotulo = `<br><br><strong>Déficits gemelos.</strong> ${priv >= 0 ? "El ahorro privado no alcanza para cubrir el déficit fiscal y el resto lo pone el exterior." : "Además el sector privado invierte más de lo que ahorra: tanto el Estado como los privados dependen del ahorro externo."}`; else if (pub > 0 && ext < 0) rotulo = `<br><br><strong>Superávits gemelos.</strong>`; else if (pub < 0 && ext <= 0) rotulo = `<br><br>El déficit fiscal lo financia <strong>completo el ahorro privado local</strong>${ext < 0 ? ", que además alcanza para prestarle al exterior" : ""}.`;
    return g + `<div class="feedback ok">${frases.join(" y ")}.${rotulo}<br><br><span class="mono">(${et(priv)}) + (${et(pub)}) + (${et(ext)}) = 0</span></div>`;
  }
};

function diagramaFlujo(resalte) {
  const on = k => resalte === k;
  const W = 380, H = 300;
  const az = "var(--blue)", gr = "var(--ink-soft)";
  const flecha = (id, color) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:${color}"/></marker>`;
  const t = (x, y, s, st) => `<text x="${x}" y="${y}" style="font-size:11px;text-anchor:middle;${st}">${s}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:Lato,system-ui,sans-serif;">\n      <defs>${flecha("fz", az)}${flecha("fg", gr)}</defs>\n      ${t(190, 14, "MERCADO DE BIENES Y SERVICIOS", "fill:var(--ink-soft);font-size:10px;letter-spacing:0.05em;font-weight:700;")}\n      <path d="M60,120 C60,20 320,20 320,120" style="fill:none;stroke:${az};stroke-width:${on("gasto") ? 4 : 2}" marker-end="url(#fz)"/>\n      ${t(190, 38, "$ gasto en bienes finales", `fill:${az};font-weight:${on("gasto") ? 900 : 700};`)}\n      <path d="M320,120 C320,70 60,70 60,120" style="fill:none;stroke:${gr};stroke-width:1.5;stroke-dasharray:4 3" marker-end="url(#fg)"/>\n      ${t(190, 70, "bienes y servicios", `fill:${gr};font-size:10.5px;`)}\n      <rect x="10" y="120" width="100" height="60" rx="6" style="fill:var(--bg-soft);stroke:var(--ink);stroke-width:1"/>\n      ${t(60, 155, "Familias", "font-size:13px;font-weight:700;fill:var(--ink);")}\n      <rect x="270" y="120" width="100" height="60" rx="6" style="fill:${on("producto") ? "var(--blue-soft)" : "var(--bg-soft)"};stroke:${on("producto") ? az : "var(--ink)"};stroke-width:${on("producto") ? 2.5 : 1}"/>\n      ${t(320, 150, "Empresas", "font-size:13px;font-weight:700;fill:var(--ink);")}\n      ${on("producto") ? t(320, 167, "valor agregado", `fill:${az};font-size:10.5px;font-weight:700;`) : ""}\n      <path d="M60,180 C60,230 320,230 320,180" style="fill:none;stroke:${gr};stroke-width:1.5;stroke-dasharray:4 3" marker-end="url(#fg)"/>\n      ${t(190, 237, "trabajo, tierra, capital", `fill:${gr};font-size:10.5px;`)}\n      <path d="M320,180 C320,280 60,280 60,180" style="fill:none;stroke:${az};stroke-width:${on("ingreso") ? 4 : 2}" marker-end="url(#fz)"/>\n      ${t(190, 270, "$ salarios, rentas, intereses, ganancias", `fill:${az};font-weight:${on("ingreso") ? 900 : 700};`)}\n      ${t(190, 294, "MERCADO DE FACTORES", "fill:var(--ink-soft);font-size:10px;letter-spacing:0.05em;font-weight:700;")}\n    </svg>\n    <div class="leyenda"><span><span style="color:var(--blue)">━</span> flujos de dinero</span><span><span style="color:var(--ink-soft)">┅</span> flujos reales</span></div>`;
}

const SIM_FLUJO = {
  id: "flujo",
  intro: `<p class="sub" style="margin:0;">Una economía mínima: trigo → harina → pan. Las familias solo compran el pan, por ${pesos(500)}. ¿Cuánto vale el PIB? Elegí un método y vas a ver que <strong>los tres dan lo mismo</strong>… salvo que caigas en la trampa.</p>`,
  inicial: {
    met: "gasto"
  },
  toggles: [ {
    k: "met",
    label: "Medir el PIB por el método…",
    opciones: [ [ "gasto", "Del gasto" ], [ "ingreso", "Del ingreso (o renta)" ], [ "producto", "Del producto (valor agregado)" ], [ "trampa", "Sumando todas las ventas" ] ]
  } ],
  dibujar(v) {
    const diag = diagramaFlujo(v.met === "trampa" ? "producto" : v.met);
    let tabla = "", total = 500, expl = "";
    if (v.met === "gasto") {
      tabla = `<table class="tabla-datos"><tr><th>Quién compra</th><th>Qué compra</th><th>Gasto final</th></tr>\n          <tr><td>Familias</td><td>Pan</td><td>${pesos(500)}</td></tr><tr class="destacada"><td colspan="2">PIB</td><td>${pesos(500)}</td></tr></table>`;
      expl = "Se suma solo lo que compran los <strong>usuarios finales</strong> (consumo, inversión, gasto público y exportaciones netas). El trigo y la harina no se cuentan aparte: ya están adentro del precio del pan.";
    } else if (v.met === "ingreso") {
      const filas = CADENA.flatMap(e => e.ingresos.map(([k, n]) => `<tr><td>${e.quien}</td><td>${k}</td><td>${pesos(n)}</td></tr>`)).join("");
      tabla = `<table class="tabla-datos"><tr><th>Empresa</th><th>Pago a los factores</th><th>Monto</th></tr>${filas}<tr class="destacada"><td colspan="2">PIB</td><td>${pesos(500)}</td></tr></table>`;
      expl = "Se suma lo que cobran los dueños de los factores de producción: <strong>salarios</strong> (trabajo), <strong>rentas y alquileres</strong> (tierra), <strong>intereses</strong> (capital prestado) y <strong>ganancias</strong> (empresarios). Todo peso que se gasta en el pan termina, tarde o temprano, en el bolsillo de alguien.";
    } else if (v.met === "producto") {
      const filas = CADENA.map(e => `<tr><td>${e.quien}</td><td>${pesos(e.vende)}</td><td>${pesos(e.compra)}</td><td>${pesos(e.vende - e.compra)}</td></tr>`).join("");
      tabla = `<table class="tabla-datos"><tr><th>Empresa</th><th>Vende</th><th>Compra a otras empresas</th><th>Valor agregado</th></tr>${filas}<tr class="destacada"><td colspan="3">PIB</td><td>${pesos(500)}</td></tr></table>`;
      expl = "Cada empresa aporta solo lo que <strong>agrega</strong>: lo que vende menos lo que le compró a otras empresas. Sumando los valores agregados de toda la cadena se llega al valor del bien final.";
    } else {
      total = 850;
      const filas = CADENA.map(e => `<tr><td>${e.quien}</td><td>${pesos(e.vende)}</td></tr>`).join("");
      tabla = `<table class="tabla-datos"><tr><th>Empresa</th><th>Ventas</th></tr>${filas}<tr class="destacada"><td>Suma</td><td>${pesos(850)}</td></tr></table>`;
      expl = `<strong>Esto está mal: es doble conteo.</strong> El trigo se contó tres veces (cuando lo vende el productor, adentro de la harina y adentro del pan) y la harina dos. La economía no produjo ${pesos(850)} de cosas nuevas: produjo ${pesos(500)}. Por eso el PIB solo cuenta bienes finales, o valor agregado.`;
    }
    return diag + tabla + `<div class="feedback ${v.met === "trampa" ? "bad" : "ok"}">${expl}</div>` + (v.met !== "trampa" ? `<p class="nota-chica">Por qué tienen que dar lo mismo: todo lo que se gasta en bienes finales (gasto) es lo que se vendió (producto), y todo lo que se vendió se reparte entre quienes aportaron a producirlo (ingreso). Son tres fotos del mismo flujo circular, tomadas en lugares distintos del circuito.</p>` : "");
  }
};

const INTRO_CLASKEYN = `\n    <table class="tabla-comp">\n      <tr><th></th><th>Clásicos</th><th>Keynesianos</th></tr>\n      <tr><td>Qué manda</td><td>La oferta: todo lo que se produce se vende (ley de Say)</td><td>La demanda: se produce lo que se espera vender (demanda efectiva)</td></tr>\n      <tr><td>Precios y salarios</td><td>Flexibles: se ajustan rápido</td><td>Rígidos, sobre todo a la baja</td></tr>\n      <tr><td>Desempleo</td><td>Voluntario o friccional: se resuelve solo</td><td>Puede ser involuntario y durar</td></tr>\n      <tr><td>Ahorro e inversión</td><td>Se igualan por la tasa de interés</td><td>Se igualan por cambios en el ingreso</td></tr>\n      <tr><td>El dinero</td><td>Neutral: solo mueve precios</td><td>En el corto plazo puede mover la producción</td></tr>\n      <tr><td>Oferta agregada</td><td>Vertical, en el pleno empleo</td><td>Plana o con pendiente en el corto plazo</td></tr>\n      <tr><td>Política fiscal</td><td>Desplaza a la inversión privada (<em>crowding out</em>); equivalencia ricardiana (Barro, nueva escuela clásica)</td><td>Tiene efecto multiplicador</td></tr>\n      <tr><td>Rol del Estado</td><td>Presupuesto equilibrado (finanzas sanas)</td><td>Estabilizar el ciclo (finanzas funcionales)</td></tr>\n    </table>\n    <p class="nota-chica" style="margin-top:8px;">Hoy casi todos los economistas combinan las dos miradas: más keynesiana para el corto plazo, más clásica para el largo. Ahora aplicalo: ¿quién diría cada frase?</p>`;

const SIM_TRABAJO = {

  intro: `<p class="sub" style="margin:0;">Llega una crisis y las empresas quieren contratar menos gente a cada salario: la demanda de trabajo cae. Mirá qué pasa según quién tenga razón sobre los salarios.</p>`,
  inicial: {
    modelo: "clas",
    caida: 16
  },
  toggles: [ {
    k: "modelo",
    label: "Modelo",
    opciones: [ [ "clas", "Clásico: el salario baja" ], [ "keyn", "Keynesiano: el salario no baja" ] ]
  } ],
  sliders: [ {
    k: "caida",
    label: "Caída de la demanda de trabajo",
    min: 0,
    max: 30,
    fmt: v => v + " mil puestos"
  } ],
  dibujar(v) {
    const ld = w => 100 - 2 * w - v.caida, ls = w => 20 + 2 * w;
    const ser = [ {
      pts: recta(ls(0), 0, ls(40), 40),
      color: "var(--ocre)",
      label: "Oferta de trabajo",
      labelEn: [ ls(38), 38 ],
      anchor: "end",
      dx: -6
    }, ...v.caida ? [ {
      pts: recta(100, 0, 20, 40),
      color: "var(--ink-soft)",
      dash: "4 4",
      w: 1.4,
      label: "Demanda antes",
      labelEn: [ 28, 36 ]
    } ] : [], {
      pts: recta(ld(0), 0, ld(40), 40),
      color: "var(--blue)",
      label: "Demanda",
      labelEn: [ ld(4), 4 ]
    } ];
    if (v.modelo === "clas") {
      const w = (80 - v.caida) / 4, L = ls(w);
      return grafico({
        xmax: 120,
        ymax: 40,
        xlabel: "Empleo (miles)",
        ylabel: "Salario real",
        xticks: [ 0, 60, 120 ],
        yticks: [ 0, 20, 40 ],
        series: ser,
        guiasH: [ {
          y: w,
          x2: L
        } ],
        guiasV: [ {
          x: L,
          y2: w
        } ],
        puntos: [ {
          x: L,
          y: w,
          t: "nuevo equilibrio"
        }, ...v.caida ? [ {
          x: 60,
          y: 20,
          color: "var(--ink-soft)",
          r: 3
        } ] : [] ]
      }) + datos([ [ "Salario", fmt(w, 1) + " (antes 20)" ], [ "Empleo", fmt(L, 1) + " mil (antes 60)" ], [ "Desempleo involuntario", "0", "" ] ]) + `<div class="feedback ok"><strong>Visión clásica.</strong> El salario baja hasta que todo el que quiere trabajar a ese salario consigue empleo. El empleo cae ${fmt(60 - L, 1)} mil, pero esas personas <em>eligieron</em> no trabajar por un salario más bajo: no hay desempleo involuntario. El mercado se vacía solo; el problema, si lo hay, es que algo impida que el salario baje.</div>`;
    }
    const L = ld(20), quieren = ls(20), des = quieren - L;
    return grafico({
      xmax: 120,
      ymax: 40,
      xlabel: "Empleo (miles)",
      ylabel: "Salario real",
      xticks: [ 0, 60, 120 ],
      yticks: [ 0, 20, 40 ],
      series: [ ...ser, ...des > 0 ? [ {
        pts: recta(L, 20, quieren, 20),
        color: "var(--rojo)",
        w: 5,
        op: .55
      } ] : [] ],
      guiasH: [ {
        y: 20,
        color: "var(--rojo)",
        t: "el salario no baja"
      } ],
      puntos: [ {
        x: L,
        y: 20,
        t: "trabajan",
        dy: 16,
        anchor: "end",
        dx: -6
      }, {
        x: quieren,
        y: 20,
        color: "var(--ocre)",
        t: "quieren trabajar",
        dy: -8
      } ]
    }) + datos([ [ "Salario", "20 (no bajó)" ], [ "Empleo", fmt(L) + " mil" ], [ "Desempleo involuntario", fmt(des) + " mil", des ? "malo" : "" ] ]) + `<div class="feedback bad"><strong>Visión keynesiana.</strong> El salario no baja (contratos, convenios colectivos, normas sobre lo que es un salario justo), así que el ajuste lo hace la cantidad: ${fmt(des)} mil personas quieren trabajar al salario vigente y no consiguen. Eso es <strong>desempleo involuntario</strong>. Y Keynes agregaba algo más: aunque el salario bajara, no está claro que se arregle, porque con salarios más bajos cae el consumo y con él, otra vez, la demanda de trabajo.</div>`;
  }
};

const SIM_INFLACION = {
  id: "inflacion",
  intro: `<p class="sub" style="margin:0;">Aumenta la cantidad de dinero (y con ella la demanda agregada). ¿Suben los precios, sube la producción, o las dos cosas? Depende de la forma de la oferta agregada, que es justamente donde clásicos y keynesianos no coinciden.</p>`,
  inicial: {
    modelo: "keyn",
    m: 20,
    brecha: 15
  },
  toggles: [ {
    k: "modelo",
    label: "Modelo",
    opciones: [ [ "clas", "Clásico" ], [ "keyn", "Keynesiano" ] ]
  } ],
  sliders: [ {
    k: "m",
    label: "Aumento de la cantidad de dinero",
    min: 0,
    max: 60,
    step: 5,
    fmt: v => "+" + v + "%"
  }, {
    k: "brecha",
    label: "Qué tan lejos del pleno empleo está la economía",
    min: 0,
    max: 30,
    step: 5,
    fmt: v => v === 0 ? "en el pleno empleo" : v + "% por debajo",
    si: v => v.modelo === "keyn"
  } ],
  dibujar(v) {
    const clas = v.modelo === "clas";
    const Y0 = clas ? 100 : 100 - v.brecha, MV0 = 100 * Y0, MV1 = MV0 * (1 + v.m / 100);
    let Y1, P1;
    if (clas) {
      Y1 = 100;
      P1 = MV1 / 100;
    } else if (MV1 / 100 <= 100) {
      Y1 = MV1 / 100;
      P1 = 100;
    } else {
      Y1 = 100;
      P1 = MV1 / 100;
    }
    const oa = clas ? [ recta(100, 60, 100, 180) ] : [ [ [ 50, 100 ], [ 100, 100 ], [ 100, 180 ] ] ];
    const g = grafico({
      xmin: 50,
      xmax: 130,
      ymin: 60,
      ymax: 180,
      xlabel: "Producto (Y)",
      ylabel: "Nivel de precios (P)",
      xticks: [ 60, 100, 120 ],
      yticks: [ 100, 150 ],
      series: [ {
        pts: oa[0],
        color: "var(--ocre)",
        label: "Oferta agregada",
        labelEn: [ 100, 172 ],
        anchor: "end",
        dx: -5
      }, ...v.m ? [ {
        pts: curva(y => MV0 / y, 50, 130),
        color: "var(--ink-soft)",
        dash: "4 4",
        w: 1.4,
        label: "DA antes",
        labelEn: [ 125, MV0 / 125 ],
        dy: 14
      } ] : [], {
        pts: curva(y => MV1 / y, 50, 130),
        color: "var(--blue)",
        label: "DA",
        labelEn: [ 126, MV1 / 126 ]
      } ],
      guiasV: [ {
        x: 100,
        t: "pleno empleo",
        ty: 30
      } ],
      puntos: [ ...v.m ? [ {
        x: Y0,
        y: MV0 / Y0,
        color: "var(--ink-soft)",
        r: 3
      } ] : [], {
        x: Y1,
        y: P1,
        t: "equilibrio"
      } ]
    });
    const dY = (Y1 / Y0 - 1) * 100, dP = (P1 / (MV0 / Y0) - 1) * 100;
    const texto = clas ? `<strong>Teoría cuantitativa.</strong> MV = PY: con la velocidad (V) estable y el producto fijado por el pleno empleo, si el dinero sube ${v.m}%, los precios suben ${v.m}%. La producción no cambia. De ahí la frase "la inflación es siempre un fenómeno monetario".` : v.brecha === 0 ? `Ya estás en el pleno empleo: no hay trabajadores ni máquinas ociosas, así que la mayor demanda solo puede subir los precios. En el pleno empleo, keynesianos y clásicos coinciden.` : dP < .5 ? `<strong>Hay capacidad ociosa:</strong> la mayor demanda se transforma entera en más producción (+${fmt(dY, 1)}%) sin subir precios. Todavía queda ${fmt(100 - Y1, 1)}% para llegar al pleno empleo.` : `Primero la demanda llenó la capacidad ociosa (la producción subió ${fmt(dY, 1)}% hasta el pleno empleo) y de ahí en adelante ya no hay con qué producir más: el resto se fue a precios (+${fmt(dP, 1)}%). Eso es <strong>inflación de demanda</strong>.`;
    return g + datos([ [ "Producción", (dY >= 0 ? "+" : "") + fmt(dY, 1) + "%" ], [ "Precios", (dP >= 0 ? "+" : "") + fmt(dP, 1) + "%", dP > .5 ? "malo" : "" ] ]) + `<div class="feedback ok">${texto}</div>` + (clas ? "" : `<p class="nota-chica">La oferta agregada en forma de "L invertida" es una simplificación: en la realidad los precios empiezan a subir antes de llegar al pleno empleo, porque algunos sectores se saturan antes que otros.</p>`);
  }
};

const INTRO_FINANZAS = `\n    <p style="margin:0 0 8px;"><strong>Finanzas sanas</strong> (la tradición clásica): el Estado debe gastar lo que recauda, igual que una familia. El déficit es malo en sí mismo y hay que evitarlo en cualquier momento del ciclo.</p>\n    <p style="margin:0 0 8px;"><strong>Finanzas funcionales</strong> (Abba Lerner, 1943): lo que importa no es si el presupuesto cierra, sino qué efecto tiene sobre la economía. El gasto y los impuestos son herramientas para lograr pleno empleo sin inflación; el déficit o el superávit son un medio, no un fin.</p>\n    <p class="nota-chica" style="margin:0;">Ninguna de las dos está libre de críticas. A las finanzas sanas se les objeta que recortar en plena recesión la profundiza. A las funcionales, que ignoran cuánta deuda puede sostener un país y, en economías con escasez de dólares como la argentina, cuánto financiamiento consigue.</p>`;

const U4_FINANZAS = BANCOS.U4_FINANZAS;

const INTRO_DINERO = `\n    <p style="margin:0 0 8px;">Sin dinero, para cambiar algo necesitás encontrar a alguien que tenga lo que vos querés y que quiera lo que vos tenés: la <em>doble coincidencia de necesidades</em> del trueque. El dinero resuelve eso cumpliendo tres funciones:</p>\n    <ul class="lista-teoria">\n      <li><strong>Medio de cambio</strong>: se acepta a cambio de cualquier cosa.</li>\n      <li><strong>Unidad de cuenta</strong>: es la vara con la que medimos y comparamos precios.</li>\n      <li><strong>Reserva de valor</strong>: permite guardar poder de compra para usarlo más adelante.</li>\n    </ul>`;

const SIM_SHOCKS = {
  id: "shocks",
  intro: `<p class="sub" style="margin:0;">Oferta y demanda agregadas. Elegí un shock y mirá qué pasa con la producción y los precios, en el corto plazo (keynesiano, oferta con pendiente) y en la visión clásica (oferta vertical en el pleno empleo).</p>`,
  inicial: {
    tipo: "omenos",
    modelo: "keyn",
    tam: 15
  },
  toggles: [ {
    k: "tipo",
    label: "Shock",
    opciones: [ [ "dmas", "Sube la demanda" ], [ "dmenos", "Cae la demanda" ], [ "omas", "Mejora la oferta" ], [ "omenos", "Cae la oferta" ] ]
  }, {
    k: "modelo",
    label: "Modelo",
    opciones: [ [ "keyn", "Corto plazo (keynesiano)" ], [ "clas", "Clásico" ] ]
  } ],
  sliders: [ {
    k: "tam",
    label: "Tamaño del shock",
    min: 5,
    max: 30,
    step: 5
  } ],
  dibujar(v) {
    const dS = v.tipo === "dmas" ? v.tam : v.tipo === "dmenos" ? -v.tam : 0;
    const oS = v.tipo === "omenos" ? v.tam : v.tipo === "omas" ? -v.tam : 0;
    const yS = v.tipo === "omas" ? v.tam : v.tipo === "omenos" ? -v.tam : 0;
    const clas = v.modelo === "clas";
    let Y1, P1;
    if (clas) {
      Y1 = 100 + yS;
      P1 = 200 + dS - Y1;
    } else {
      Y1 = (150 + dS - oS) / 1.5;
      P1 = 200 + dS - Y1;
    }
    const esDem = dS !== 0;
    const series = [];
    if (esDem) series.push({
      pts: recta(50, 150, 150, 50),
      color: "var(--ink-soft)",
      dash: "4 4",
      w: 1.4,
      label: "DA antes",
      labelEn: [ 140, 60 ],
      dy: 14
    });
    series.push({
      pts: recta(50, 150 + dS, 150, 50 + dS),
      color: "var(--blue)",
      label: "DA",
      labelEn: [ 145, 55 + dS ]
    });
    if (clas) {
      if (!esDem) series.push({
        pts: recta(100, 50, 100, 170),
        color: "var(--ink-soft)",
        dash: "4 4",
        w: 1.4
      });
      series.push({
        pts: recta(100 + yS, 50, 100 + yS, 170),
        color: "var(--ocre)",
        label: "OA",
        labelEn: [ 100 + yS, 165 ]
      });
    } else {
      if (!esDem) series.push({
        pts: recta(50, 75, 150, 125),
        color: "var(--ink-soft)",
        dash: "4 4",
        w: 1.4,
        label: "OA antes",
        labelEn: [ 58, 79 ],
        dy: 15
      });
      series.push({
        pts: recta(50, 75 + oS, 150, 125 + oS),
        color: "var(--ocre)",
        label: "OA",
        labelEn: [ 145, 122.5 + oS ]
      });
    }
    const g = grafico({
      xmin: 50,
      xmax: 150,
      ymin: 50,
      ymax: 170,
      xlabel: "Producto (Y)",
      ylabel: "Nivel de precios (P)",
      xticks: [ 60, 100, 140 ],
      yticks: [ 100, 150 ],
      series: series,
      puntos: [ {
        x: 100,
        y: 100,
        color: "var(--ink-soft)",
        r: 3
      }, {
        x: Y1,
        y: P1,
        t: "nuevo equilibrio"
      } ]
    });
    const dY = Y1 - 100, dP = P1 - 100;
    const signo = x => Math.abs(x) < .05 ? "sin cambios" : (x > 0 ? "+" : "") + fmt(x, 1) + "%";
    let texto;
    if (v.tipo === "omenos" && !clas) texto = `<strong>Estanflación:</strong> la producción cae y los precios suben al mismo tiempo (pensá en una suba fuerte del petróleo). Es el shock más incómodo para la política: si el Banco Central estimula la demanda para recuperar la producción, empuja todavía más los precios; si la enfría para frenar los precios, hunde más la producción. No hay una respuesta que arregle las dos cosas.`; else if (v.tipo === "omas" && !clas) texto = `<strong>El mejor de los shocks:</strong> más producción y precios más bajos a la vez (una mejora tecnológica, una cosecha récord, un abaratamiento de la energía).`; else if (v.tipo === "dmas" && !clas) texto = `Suben a la vez la producción y los precios: la economía se "calienta". Cuanto más cerca del pleno empleo, más se va a precios y menos a producción.`; else if (v.tipo === "dmenos" && !clas) texto = `Caen a la vez la producción y los precios: recesión con menos inflación. Acá la política tiene una receta clara: estimular la demanda recupera la producción sin empeorar los precios.`; else if (esDem) texto = `<strong>En la visión clásica, la demanda no mueve la producción:</strong> la oferta agregada es vertical en el pleno empleo, así que todo el shock se va a precios. Comparalo con el modelo de corto plazo.`; else texto = `<strong>En la visión clásica, los shocks de oferta mueven el producto potencial</strong> (cuánto se puede producir con pleno empleo). ${v.tipo === "omas" ? "Más capacidad: más producción y precios más bajos." : "Menos capacidad: menos producción y precios más altos."}`;
    return g + datos([ [ "Producción", signo(dY), dY < -.05 ? "malo" : "" ], [ "Precios", signo(dP), dP > .05 ? "malo" : "" ] ]) + `<div class="feedback ok">${texto}</div>`;
  }
};

function lineaDeTiempoAR(vj) {
  const L = VIAJE_AR, n = L.length, x = i => 16 + i * (328 / (n - 1));
  let s = `<svg viewBox="0 0 360 62" xmlns="http://www.w3.org/2000/svg" class="viaje-linea" style="width:100%;height:auto;display:block;font-family:Lato,system-ui,sans-serif;">`;
  s += `<path d="M${x(0)},26 H${x(n - 1)}" stroke="var(--rule)" stroke-width="4" stroke-linecap="round"/>`;
  s += `<path d="M${x(0)},26 H${x(vj.i)}" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>`;
  L.forEach((p, i) => {
    const r = vj.resp[i], hecho = r !== undefined, bien = hecho && r === p.ok;
    const fill = i === vj.i ? "#fff" : hecho ? bien ? "var(--verde)" : "var(--rojo)" : i < vj.i ? "var(--blue)" : "#fff";
    const stroke = i === vj.i ? "var(--blue)" : hecho ? fill : i < vj.i ? "var(--blue)" : "var(--rule)";
    const arriba = i % 2 === 0;
    s += `<g data-vja-ir="${i}" style="cursor:pointer">\n        <circle cx="${x(i)}" cy="26" r="${i === vj.i ? 9 : 7}" style="fill:${fill};stroke:${stroke};stroke-width:${i === vj.i ? 3 : 2}"/>\n        <text x="${x(i)}" y="29.5" text-anchor="middle" style="font-size:9px;font-weight:900;fill:${i === vj.i ? "var(--blue)" : hecho || i < vj.i ? "#fff" : "var(--ink-soft)"}">${i + 1}</text>\n        <text x="${i === 0 ? x(i) - 8 : i === n - 1 ? x(i) + 8 : x(i)}" y="${arriba ? 10 : 50}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" style="font-size:8.5px;fill:${i === vj.i ? "var(--blue)" : "var(--ink-soft)"};font-weight:${i === vj.i ? 900 : 400}">${p.anio}</text>\n        <circle cx="${x(i)}" cy="26" r="14" style="fill:transparent"/>\n      </g>`;
  });
  return s + `</svg>`;
}

function tonoEpocaAR(i) {
  const t = i / (VIAJE_AR.length - 1);
  const a = [ 247, 239, 226 ], b = [ 236, 242, 248 ];
  return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * t)).join(",")})`;
}

  }).join("")}</div>\n        ${r !== undefined ? `<div class="feedback ${r === p.ok ? "ok" : "bad"}">${p.por}</div>` : ""}\n      </div>\n      <div class="viaje-nav">\n        <button class="btn secondary" data-vja-ir="${vj.i - 1}" ${vj.i === 0 ? "disabled" : ""}>‹ Parada anterior</button>\n        ${vj.i < VIAJE_AR.length - 1 ? `<button class="btn" data-vja-ir="${vj.i + 1}">Siguiente parada: ${VIAJE_AR[vj.i + 1].anio} ›</button>` : `<button class="btn" data-vja-reiniciar="1">Volver a empezar</button>`}\n      </div>\n      ${final ? `<div class="feedback ok" style="margin-top:12px;"><strong>Terminaste el viaje: ${fmt(VIAJE_AR[VIAJE_AR.length - 1].anio - VIAJE_AR[0].anio)} años en ${VIAJE_AR.length} paradas, ${aciertos} de ${VIAJE_AR.length} respuestas bien.</strong> El hilo de Ferrer: en cada etapa lo que decide el rumbo es cómo el país se vincula con el mundo (de la plata de Potosí a los cueros, de los granos a la industria, y de ahí a la deuda) y si tiene la <em>densidad nacional</em> para aprovechar ese vínculo en vez de quedar a merced de él.</div>` : ""}`;
}

function bindViajeU5() {
  const vj = state.viajeAR;
  if (!vj || !document.querySelector("[data-vja-ir]")) return;
  document.querySelectorAll("[data-vja-ir]").forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.vjaIr;
      if (i >= 0 && i < VIAJE_AR.length && i !== vj.i) {
        vj.i = i;
        refreshUnidad();
        irAlDetalle();
      }
    };
  });
  document.querySelectorAll("[data-vja-op]").forEach(b => {
    b.onclick = () => {
      vj.resp[vj.i] = +b.dataset.vjaOp;
      refreshUnidad();
    };
  });
  const re = document.querySelector("[data-vja-reiniciar]");
  if (re) re.onclick = () => {
    state.viajeAR = {
      i: 0,
      resp: {}
    };
    refreshUnidad();
    irAlDetalle();
  };
}

}

function bindMinistroU5() {
  const m = state.ministro;
  if (!m || !document.querySelector("[data-min-op], [data-min-reiniciar]")) return;
  document.querySelectorAll("[data-min-op]").forEach(b => {
    b.onclick = () => {
      m.elig[m.paso] = +b.dataset.minOp;
      refreshUnidad();
    };
  });
  const s = document.querySelector("[data-min-seguir]");
  if (s) s.onclick = () => {
    m.paso++;
    refreshUnidad();
    irAlDetalle();
  };
  const r = document.querySelector("[data-min-reiniciar]");
  if (r) r.onclick = () => {
    state.ministro = {
      paso: 0,
      elig: {}
    };
    refreshUnidad();
    irAlDetalle();
  };
}

const SG = {
  Y0: 100,
  X0: 20,
  M: .2,
  R0: 24,
  SERV: 1
};

function sgNuevo() {
  return {
    anio: 0,
    Y: SG.Y0,
    X: SG.X0,
    R: SG.R0,
    crisis: 0,
    hist: [ [ 0, SG.Y0, SG.R0 ] ],
    marcas: [],
    ultimo: ""
  };
}

const SIM_STOPGO = {
  id: "stopgo",
  intro: `<p class="sub" style="margin:0;">Sos el gobierno. La <strong>industria</strong> produce para el mercado interno y necesita importar insumos y máquinas: cuanto más crece la economía, más dólares gasta. Los dólares los trae el <strong>agro</strong>, que exporta, pero sus ventas crecen despacio. Elegí a qué ritmo crecer y dejá pasar los años. Es lo que Marcelo Diamand llamó una <strong>estructura productiva desequilibrada</strong>.</p>`,
  inicial: {
    pol: "acelerar",
    expo: "no",
    ...sgNuevo()
  },
  toggles: [ {
    k: "pol",
    label: "Política económica",
    opciones: [ [ "frenar", "Enfriar (0,5% anual)" ], [ "mantener", "Crecer moderado (3%)" ], [ "acelerar", "Acelerar (6%)" ] ]
  }, {
    k: "expo",
    label: "¿Exporta también la industria?",
    opciones: [ [ "no", "No: solo exporta el agro" ], [ "si", "Sí: se suman exportaciones industriales" ] ]
  } ],
  acciones: [ {
    k: "anio",
    label: "Pasa un año"
  }, {
    k: "cinco",
    label: "Pasan 5 años"
  }, {
    k: "reiniciar",
    label: "Empezar de nuevo",
    sec: true
  } ],
  accion(v, k) {
    const pasos = k === "cinco" ? 5 : 1;
    for (let n = 0; n < pasos && v.anio < 40; n++) {
      const g = {
        frenar: .005,
        mantener: .03,
        acelerar: .06
      }[v.pol];
      v.anio++;
      v.Y *= 1 + g;
      v.X *= v.expo === "si" ? 1.065 : 1.02;
      v.R += v.X - SG.M * v.Y - SG.SERV;
      v.ultimo = "";
      if (v.R < 0) {
        v.Y *= .93;
        v.X *= 1.08;
        v.R = 12;
        v.crisis++;
        v.marcas.push(v.anio);
        v.ultimo = "crisis";
      }
      v.hist.push([ v.anio, v.Y, v.R ]);
    }
  },
  dibujar(v) {
    const h = v.hist, tmax = Math.max(10, Math.ceil(v.anio / 10) * 10);
    const ymax = Math.max(140, Math.ceil(Math.max(...h.map(p => p[1])) / 20) * 20 + 20);
    const rmax = Math.max(40, Math.ceil(Math.max(...h.map(p => p[2])) / 10) * 10 + 10);
    const marcas = v.marcas.map(t => ({
      x: t,
      color: "var(--rojo)",
      t: ""
    }));
    const g1 = grafico({
      H: 190,
      xmax: tmax,
      ymax: ymax,
      ymin: 80,
      ylabel: "Producto (año 0 = 100)",
      xticks: [ 0, tmax / 2, tmax ],
      yticks: [ 80, Math.round((80 + ymax) / 2), ymax ],
      series: [ {
        pts: h.map(p => [ p[0], p[1] ]),
        color: "var(--blue)",
        label: "producto",
        anchor: "end",
        dx: -4
      } ],
      guiasV: marcas
    });
    const g2 = grafico({
      H: 160,
      xmax: tmax,
      ymax: rmax,
      xlabel: "Años",
      ylabel: "Reservas (millones de dólares, ilustrativo)",
      xticks: [ 0, tmax / 2, tmax ],
      yticks: [ 0, rmax / 2, rmax ],
      series: [ {
        pts: h.map(p => [ p[0], p[2] ]),
        color: "var(--verde)",
        label: "reservas",
        anchor: "end",
        dx: -4
      } ],
      guiasV: marcas
    });
    const M = SG.M * v.Y, saldo = v.X - M - SG.SERV;
    let txt;
    if (v.anio === 0) txt = `Arrancás con las cuentas equilibradas: el agro exporta ${fmt(v.X, 1)} y la industria importa ${fmt(M, 1)}. Elegí una política y tocá <strong>Pasa un año</strong>.`; else if (v.ultimo === "crisis") txt = `<strong>¡Stop!</strong> Se acabaron los dólares. Hay que devaluar: suben los precios de lo importado y de los alimentos, cae el salario real y la economía se achica un 7%. Con menos actividad se importa menos, se exporta algo más y las reservas se recuperan… hasta que vuelvas a acelerar. Es el ciclo que la Argentina vivió en 1949-52, 1959, 1962-63 y otras veces.`; else if (saldo < 0) txt = `Estás gastando más dólares de los que entran: este año las reservas bajan ${fmt(-saldo, 1)}. Si seguís a este ritmo, ${v.R / -saldo < 1.5 ? "<strong>el año que viene se acaban</strong>" : `se acaban en unos ${fmt(Math.floor(v.R / -saldo))} años`}.`; else txt = `Este año entran más dólares de los que salen (+${fmt(saldo, 1)}). ${v.pol === "frenar" ? 'Con la economía casi quieta sobran divisas, pero no crece el empleo: es el "stop" permanente.' : v.expo === "si" ? "Como la industria también exporta, el crecimiento se paga solo: esa es la salida que proponían Ferrer y Diamand." : "Mientras dure."}`;
    return g1 + g2 + datos([ [ "Año", fmt(v.anio) ], [ "Crisis de balanza de pagos", fmt(v.crisis), v.crisis ? "malo" : "" ], [ "Reservas", fmt(v.R, 1), v.R < 8 ? "malo" : "" ] ]) + `<div class="feedback ${v.ultimo === "crisis" || saldo < 0 ? "bad" : "ok"}">${txt}</div>`;
  },
  pie: `<p style="margin:0;font-size:13.5px;line-height:1.6;"><strong>Por qué pasa.</strong> Para Diamand (1972), la Argentina tiene dos sectores con productividades muy distintas: el agro pampeano, que produce a precios internacionales y genera divisas, y una industria con costos más altos, que vende adentro y usa divisas. Al crecer la industria, la demanda de dólares crece más rápido que la oferta: es la <strong>restricción externa</strong>. Braun y Joy (1968) formalizaron el ciclo de stop-and-go. La salida que discuten Ferrer y la CEPAL no es frenar para siempre sino cambiar la estructura: que la industria también exporte y que se sustituyan importaciones de manera eficiente. Los números del juego son ilustrativos.</p>`
};

(function aplicarConfig() {
  for (const u of UNIDADES) {
    const def = CONTENIDO_UNIDAD[u.id];
    def.nombre = u.nombre;
    const delCodigo = def.secciones;
    const usadas = new Set;
    const ordenadas = [];
    for (const a of u.actividades) {
      const s = delCodigo.find(x => x.id === a.id);
      if (!s || usadas.has(a.id)) continue;
      usadas.add(a.id);
      if (a.visible === false) continue;
      ordenadas.push({
        ...s,
        titulo: lleno(a.titulo) ? a.titulo : s.titulo,
        desc: lleno(a.descripcion) ? a.descripcion : s.desc
      });
    }
    delCodigo.forEach(s => {
      if (!usadas.has(s.id)) ordenadas.push(s);
    });
    def.secciones = ordenadas;
  }
  (NUEVAS && NUEVAS.actividades || []).forEach((a, i) => {
    if (a.visible === false) return;
    const def = CONTENIDO_UNIDAD[a.unidad];
    const donde = `Actividad nueva "${a.titulo || i + 1}"`;
    if (!def) {
      PROBLEMAS.push(`${donde}: la unidad "${a.unidad}" no existe.`);
      return;
    }
    if (!lleno(a.titulo)) {
      PROBLEMAS.push(`Actividad nueva ${i + 1}: falta el título.`);
      return;
    }
    const items = normalizarBanco(a, donde);
    if (!items.length) {
      PROBLEMAS.push(`${donde}: no tiene preguntas válidas.`);
      return;
    }
    const op = {
      orden: a.mezclar_preguntas !== false,
      opciones: !!a.mezclar_opciones
    };
    def.secciones.push({
      id: "nueva-" + (i + 1),
      titulo: a.titulo,
      desc: a.descripcion || "",
      quiz: () => preparar(items, op)
    });
  });
})();

async function enviarFormulario() {
  const f = state.form;
  f.nombre = document.getElementById("form-nombre").value.trim();
  f.apellido = document.getElementById("form-apellido").value.trim();
  f.mensaje = document.getElementById("form-mensaje").value.trim();
  if (f.nombre.length < 2) { f.error = "Poné tu nombre."; return refreshUnidad(); }
  if (f.apellido.length < 2) { f.error = "Poné tu apellido."; return refreshUnidad(); }
  if (f.mensaje.length < 5) { f.error = "Escribí un poco más."; return refreshUnidad(); }
  state.nombreAlumno = f.nombre;
  state.apellidoAlumno = f.apellido;
  f.error = ""; f.enviando = true; refreshUnidad();
  const def = CONTENIDO_UNIDAD[f.unidad], sec = def && def.secciones.find(s => s.id === f.actividad);
  const valores = {
    TIPO: f.tipo === "duda" ? "Duda" : "Error reportado",
    NOMBRE: f.nombre,
    APELLIDO: f.apellido,
    UNIDAD: `Unidad ${f.unidad}${def ? " · " + def.nombre : ""}`,
    ACTIVIDAD: sec ? `${sec.titulo} (#${f.unidad}-${sec.id})` : "",
    MENSAJE: f.mensaje
  };
  const cuerpo = new URLSearchParams();
  Object.entries(valores).forEach(([k, v]) => { if (FORMULARIO.campos[k]) cuerpo.append(FORMULARIO.campos[k], v); });
  try {
    await fetch(FORMULARIO.accion, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: cuerpo.toString() });
    f.enviado = true;
  } catch (e) {
    f.error = "No se pudo enviar. Revisá la conexión y probá de nuevo.";
  }
  f.enviando = false;
  if (state.form === f) refreshUnidad();
}

de, más ineficiente es la redistribución.</p>\n        <div class="card" id="okun-svg" style="background:var(--bg-soft);">${okunSVG(state.okun ?? 30)}</div>\n        <div style="margin-top:10px; margin-bottom:0;">\n          <label style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">Cuánto se pierde en el camino <span class="mono" id="okun-val">${state.okun ?? 30}%</span></label>\n          <input type="range" id="okun-perdida" min="0" max="80" value="${state.okun ?? 30}">\n        </div>\n      </div>`;

  });
  const misionBack = document.querySelector("[data-mision-back]");
  if (misionBack) misionBack.onclick = () => {
    state.misionId = null;
    state.misionAns = undefined;
    refreshUnidad();
  };
  document.querySelectorAll("[data-mision-opt]").forEach(b => {
    b.onclick = () => {
      state.misionAns = +b.dataset.misionOpt;
      refreshUnidad();
    };
  });
  document.querySelectorAll("[data-flujo-chip]").forEach(chip => {
    chip.onpointerdown = e => iniciarDragFlujo(chip, e, chip.dataset.flujoChip);
  });
  document.querySelectorAll(".flujo-zona.elegible").forEach(z => {
    z.onclick = () => {
      if (state.flujo && state.flujo.sel) colocarFlujo(state.flujo.sel, z.dataset.zona);
    };
  });
  document.querySelectorAll("[data-valor-si]").forEach(b => {
    b.onclick = () => {
      state.valorCosas.resp[b.dataset.valorSi] = b.dataset.valorResp;
      refreshUnidad();
    };
  });
  const valorReiniciar = document.querySelector("[data-valor-reiniciar]");
  if (valorReiniciar) valorReiniciar.onclick = () => {
    state.valorCosas = {
      resp: {}
    };
    refreshUnidad();
  };
  document.querySelectorAll("[data-dilema-opt]").forEach(b => {
    b.onclick = () => jugarRondaDilema(b.dataset.dilemaOpt);
  });
  const dilemaReiniciar = document.querySelector("[data-dilema-reiniciar]");
  if (dilemaReiniciar) dilemaReiniciar.onclick = () => {
    state.dilema = null;
    refreshUnidad();
  };
  const ultimatumOferta = document.getElementById("ultimatum-oferta");
  if (ultimatumOferta) ultimatumOferta.oninput = e => {
    state.ultimatum.oferta = +e.target.value;
    const lbl = document.getElementById("ultimatum-label");
    if (lbl) lbl.innerHTML = `Le ofrecés <span class="mono">$${state.ultimatum.oferta}</span> (vos te quedás con $${100 - state.ultimatum.oferta})`;
  };
  const ultimatumProponer = document.querySelector("[data-ultimatum-proponer]");
  if (ultimatumProponer) ultimatumProponer.onclick = () => jugarRondaUltimatum();
  const ultimatumReiniciar = document.querySelector("[data-ultimatum-reiniciar]");
  if (ultimatumReiniciar) ultimatumReiniciar.onclick = () => {
    state.ultimatum = null;
    refreshUnidad();
  };
  bindSim();
  bindMonopolioU3();
  bindExternalidadesU3();
  bindPlazaU3();
  bindEPHU4();
  bindFormulario();
  bindEquilibrioU3();
  bindUnirU3();
  bindViajeU2();
  bindCrisis30U2();
  bindViajeU5();
  bindMinistroU5();
}

mostrarProblemas();

render();

leerHash();

window.addEventListener("hashchange", leerHash);
</script>
</body>
</html>

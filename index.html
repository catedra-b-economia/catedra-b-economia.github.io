<div id="file-warning" style="display:none; position:sticky; top:0; z-index:99; background:#B7791F; color:#fff; font-family:'Lato', sans-serif; font-size:12.5px; padding:10px 16px; text-align:center;"></div>
<main id="app"></main>

<script type="module">
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "u" || e.key === "U")) e.preventDefault();
});

if (location.protocol === "file:") {
  const w = document.getElementById("file-warning");
  w.style.display = "block";
  w.textContent = "⚠ Estás abriendo el archivo directo, sin servidor. El contenido no va a cargar así — probá desde http://localhost:8000/ en cambio.";
}

const PROBLEMAS = [];

function descifrar(t) {
  const b = Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const k = new TextEncoder().encode("c4t3dr4-B·intro-econ");
  for (let i = 0; i < b.length; i++) b[i] ^= k[(i * 7 + 13) % k.length] ^ (i & 255);
  return new TextDecoder().decode(b);
}

async function leerJSON(ruta, porDefecto) {
  try {
    const r = await fetch(ruta, {
      cache: "no-cache"
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const t = (await r.text()).trim();
    return JSON.parse(t.startsWith("{") ? t : descifrar(t));
  } catch (e) {
    PROBLEMAS.push(`No se pudo leer ${ruta} (${e.message}).`);
    return porDefecto;
  }
}

const lleno = x => typeof x === "string" ? x.trim() !== "" : x !== null && x !== undefined;

function normalizarPregunta(p, comunes, donde, n) {
  const propias = Array.isArray(p.opciones) ? p.opciones.filter(lleno) : [];
  const opciones = propias.length ? propias : (comunes || []).filter(lleno);
  const correcta = Number(p.correcta) - 1;
  if (!lleno(p.texto)) {
    PROBLEMAS.push(`${donde}, pregunta ${n}: falta el texto.`);
    return null;
  }
  if (opciones.length < 2) {
    PROBLEMAS.push(`${donde}, pregunta ${n}: necesita al menos 2 opciones.`);
    return null;
  }
  if (!Number.isInteger(correcta) || correcta < 0 || correcta >= opciones.length) {
    PROBLEMAS.push(`${donde}, pregunta ${n}: "correcta" tiene que ser un número entre 1 y ${opciones.length}.`);
    return null;
  }
  return {
    texto: p.texto,
    opciones: opciones,
    correcta: correcta,
    explicacion: lleno(p.explicacion) ? p.explicacion : undefined
  };
}

  const comunes = datos && datos.opciones_comunes;
  return (datos && datos.preguntas || []).map((p, i) => normalizarPregunta(p, comunes, donde, i + 1)).filter(Boolean);

}

  irAlDetalle();
  return true;
}

}

  const h = decodeURIComponent(location.hash.slice(1));

function iniciarQuiz(key, items, regenerar) {
  state.quiz = {
    key: key,
    items: items,
    index: 0,
    score: 0,
    resp: undefined,
    regenerar: regenerar
  };
}

function reiniciarQuiz() {
  if (!state.quiz) return;
  if (state.quiz.regenerar) state.quiz.items = state.quiz.regenerar();
  state.quiz.index = 0;
  state.quiz.score = 0;
  state.quiz.resp = undefined;
}

function renderQuiz() {
  const q = state.quiz;
  if (q.index >= q.items.length) {
    return `\n        <div class="card">${q.score} de ${q.items.length} correctas.<br><strong class="mono" style="font-size:20px;">Nota: ${Math.round(q.score / q.items.length * 10)}/10</strong></div>\n        <button class="btn" data-quiz-restart="1">Jugar de nuevo</button>`;
  }
  const item = q.items[q.index];
  const resp = q.resp;
  return `\n      <div class="sub">Pregunta ${q.index + 1} de ${q.items.length} · Correctas: ${q.score}</div>\n      <div class="card"><p style="margin:0; font-size:14.5px;">${item.texto}</p></div>\n      <div class="options">\n        ${item.opciones.map((op, idx) => {
    let cls = "opt";
    if (resp !== undefined) {
      if (idx === item.correcta) cls += " correct"; else if (idx === resp) cls += " incorrect";
    }
    return `<button class="${cls}" data-quiz-opt="${idx}" ${resp !== undefined ? "disabled" : ""}>${op}</button>`;
  }).join("")}\n      </div>\n      ${resp !== undefined ? `${item.explicacion ? `<div class="feedback ${resp === item.correcta ? "ok" : "bad"}">${item.explicacion}</div>` : ""}<button class="btn block" data-quiz-next="1">Siguiente</button>` : ""}\n    `;
}

function bindQuiz() {
  document.querySelectorAll("[data-quiz-opt]").forEach(b => {
    b.onclick = () => {
      const q = state.quiz;
      const idx = +b.dataset.quizOpt;
      q.resp = idx;
      if (idx === q.items[q.index].correcta) q.score++;
      refreshUnidad();
    };
  });
  const next = document.querySelector("[data-quiz-next]");
  if (next) next.onclick = () => {
    state.quiz.index++;
    state.quiz.resp = undefined;
    refreshUnidad();
  };

  if (restart) restart.onclick = () => {
    reiniciarQuiz();
    refreshUnidad();
  };
}

function gotaPath(cx, cy, r) {
  return `M ${cx.toFixed(1)} ${(cy - r * 1.6).toFixed(1)}\n      C ${(cx + r * 1.1).toFixed(1)} ${(cy - r * .4).toFixed(1)}, ${(cx + r).toFixed(1)} ${(cy + r * .5).toFixed(1)}, ${cx.toFixed(1)} ${(cy + r).toFixed(1)}\n      C ${(cx - r).toFixed(1)} ${(cy + r * .5).toFixed(1)}, ${(cx - r * 1.1).toFixed(1)} ${(cy - r * .4).toFixed(1)}, ${cx.toFixed(1)} ${(cy - r * 1.6).toFixed(1)} Z`;
}

function okunSVG(perdida) {
  const llega = Math.round(100 * (1 - perdida / 100));
  const W = 380, H = 190, groundY = 150, leftX = 55, rightX = W - 55, bucketY = groundY - 75;
  function persona(x, label) {
    return `\n        <circle cx="${x}" cy="${groundY - 44}" r="9" fill="var(--ink)"/>\n        <path d="M ${x - 11},${groundY - 8} Q ${x},${groundY - 38} ${x + 11},${groundY - 8} Z" fill="var(--ink)"/>\n        <text x="${x}" y="${groundY - 54}" text-anchor="middle" font-size="12" font-family="Lato, sans-serif" font-weight="600" fill="var(--ink)">$${label}</text>\n      `;
  }
  const pathStartX = leftX + 26, pathEndX = rightX - 34;
  const bucketX = pathStartX + (pathEndX - pathStartX) * (perdida / 100);
  const numGotas = Math.round(perdida / 10);
  let gotas = "";
  for (let i = 0; i < numGotas; i++) {
    const t = numGotas > 1 ? i / (numGotas - 1) : 0;
    const gx = pathStartX + (bucketX - pathStartX) * t;
    const gy = bucketY + 22 + i % 3 * 11;
    gotas += `<path d="${gotaPath(gx, gy, 3.6)}" fill="var(--blue)" opacity="0.85"/>`;
  }
  return `\n    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n      <line x1="${leftX}" y1="${groundY}" x2="${rightX}" y2="${groundY}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>\n      ${persona(leftX, "100")}\n      ${persona(rightX, llega)}\n      ${gotas}\n      <g style="transition: transform 120ms ease;" transform="translate(${bucketX.toFixed(1)}, 0)">\n        <path d="M -16,${bucketY} L -11,${bucketY + 24} L 11,${bucketY + 24} L 16,${bucketY} Z" fill="var(--ink-soft)"/>\n        <path d="M -16,${bucketY} A 16 5 0 0 0 16,${bucketY}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/>\n        <path d="M -12,${bucketY - 8} Q 0,${bucketY - 20} 12,${bucketY - 8}" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>\n      </g>\n      <text x="${(pathStartX + pathEndX) / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" font-family="Lato, sans-serif" fill="var(--ink-soft)">se pierden $${perdida} en el camino</text>\n    </svg>`;
}

function fppPuntos(A, B, factor) {
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const th = i / 40 * (Math.PI / 2);
    pts.push([ A * Math.cos(th) * factor, B * Math.sin(th) * factor ]);
  }
  return pts;
}

function fppSVG(pos, recursos, tecnologia) {
  const escala = tecnologia / 100;
  const A = 100 * escala, B = 100 * escala;
  const factor = recursos / 100;
  const th = pos / 100 * (Math.PI / 2);
  const X = A * Math.cos(th) * factor, Y = B * Math.sin(th) * factor;
  const W = 380, H = 300, ML = 34, MB = 26, MT = 14, MR = 14;
  const plotW = W - ML - MR, plotH = H - MT - MB, DOM = 145;
  const sx = q => ML + q / DOM * plotW;
  const sy = p => MT + plotH - p / DOM * plotH;
  const curva = fppPuntos(A, B, 1).map((p, i) => (i === 0 ? "M" : "L") + sx(p[0]).toFixed(1) + "," + sy(p[1]).toFixed(1)).join(" ");
  const th1 = th - .05, th2 = th + .05;
  const P1 = [ A * Math.cos(th1), B * Math.sin(th1) ];
  const P2 = [ A * Math.cos(th2), B * Math.sin(th2) ];
  const pendiente = Math.abs((P2[1] - P1[1]) / (P2[0] - P1[0]));
  return `\n    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + plotH}" stroke="var(--ink)" stroke-width="1"/>\n      <line x1="${ML}" y1="${MT + plotH}" x2="${W - MR}" y2="${MT + plotH}" stroke="var(--ink)" stroke-width="1"/>\n      <path d="${curva}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>\n      <circle cx="${sx(X).toFixed(1)}" cy="${sy(Y).toFixed(1)}" r="5" fill="${factor < .98 ? "var(--ocre)" : "var(--verde)"}"/>\n    </svg>\n    <div class="mono" style="text-align:center; font-size:11px; color:var(--ink-soft); margin-top:4px;">Eje vertical: Maquinaria · Eje horizontal: Alimentos</div>\n    <div class="mono" style="text-align:center; font-size:12.5px; margin-top:6px;">\n      ${factor < .98 ? "Punto dentro de la frontera: ineficiente. Con los mismos recursos se podría producir más de ambos bienes." : "Punto sobre la frontera: eficiente. Costo de oportunidad en este punto ≈ " + pendiente.toFixed(2) + " de maquinaria por cada alimento extra."}\n    </div>`;
}

function mezclar(lista) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [ copia[j], copia[i] ];
  }
  return copia;
}

function iniciarDragFlujo(chipEl, pointerEvent, itemId) {
  const rect = chipEl.getBoundingClientRect();
  const x0 = pointerEvent.clientX, y0 = pointerEvent.clientY;
  const offsetX = pointerEvent.clientX - rect.left, offsetY = pointerEvent.clientY - rect.top;
  chipEl.setPointerCapture(pointerEvent.pointerId);
  chipEl.classList.add("arrastrando");
  chipEl.style.width = rect.width + "px";
  chipEl.style.left = rect.left + "px";
  chipEl.style.top = rect.top + "px";
  function mover(e) {
    chipEl.style.left = e.clientX - offsetX + "px";
    chipEl.style.top = e.clientY - offsetY + "px";
    document.querySelectorAll(".flujo-zona").forEach(z => z.classList.remove("sobre"));
    const abajo = document.elementFromPoint(e.clientX, e.clientY);
    const zona = abajo && abajo.closest(".flujo-zona");
    if (zona) zona.classList.add("sobre");
  }
  function terminar() {
    chipEl.removeEventListener("pointermove", mover);
    chipEl.removeEventListener("pointerup", soltar);
    chipEl.removeEventListener("pointercancel", cancelar);
    document.querySelectorAll(".flujo-zona").forEach(z => z.classList.remove("sobre"));
  }
  function cancelar() {
    terminar();
    refreshUnidad();
  }
  function soltar(e) {
    terminar();
    if (Math.hypot(e.clientX - x0, e.clientY - y0) < 6) {
      state.flujo.sel = state.flujo.sel === itemId ? null : itemId;
      refreshUnidad();
      return;
    }
    const abajo = document.elementFromPoint(e.clientX, e.clientY);
    const zonaEl = abajo && abajo.closest(".flujo-zona");
    if (zonaEl) colocarFlujo(itemId, zonaEl.dataset.zona); else refreshUnidad();
  }
  chipEl.addEventListener("pointermove", mover);
  chipEl.addEventListener("pointerup", soltar);
  chipEl.addEventListener("pointercancel", cancelar);
}

const DILEMA_RONDAS = 5;

function pagoDilema(a, b) {
  if (a === "cooperar" && b === "cooperar") return [ 3, 3 ];
  if (a === "traicionar" && b === "traicionar") return [ 1, 1 ];
  if (a === "traicionar" && b === "cooperar") return [ 5, 0 ];
  return [ 0, 5 ];
}

function jugarRondaDilema(eleccionJugador) {
  const s = state.dilema;
  if (!s || s.terminado) return;
  const eleccionBot = s.historial.length === 0 ? "cooperar" : s.historial[s.historial.length - 1].jugador;
  const [pj, pb] = pagoDilema(eleccionJugador, eleccionBot);
  s.historial.push({
    ronda: s.ronda,
    jugador: eleccionJugador,
    bot: eleccionBot,
    pj: pj,
    pb: pb
  });
  s.puntosJugador += pj;
  s.puntosBot += pb;
  if (s.ronda >= DILEMA_RONDAS) s.terminado = true; else s.ronda++;
  refreshUnidad();
}

function renderDilemaU3() {

function plazaBots(p) {
  const prev = p.hist[p.hist.length - 1];
  const ramiro = !prev ? 5 : Math.round((prev.vos + prev.rosa + prev.poli) / 3);
  if (p.regla === "tasa" || p.regla === "multa") return { rosa: 10, poli: 10, ramiro: 10 };
  return { rosa: 10, poli: 0, ramiro };
}

function jugarRondaPlaza() {
  const p = state.plaza;
  const vos = p.regla === "tasa" ? 10 : p.aporte;
  const b = plazaBots(p);
  const S = vos + b.rosa + b.poli + b.ramiro;
  const parte = S * PLAZA_MULT / 4;
  let multaVos = 0, costoMulta = 0;
  if (p.regla === "multa" && vos < 5) { multaVos = 6; costoMulta = 2; }
  p.hist.push({ ronda: p.ronda, vos, ...b, S, gVos: 10 - vos + parte - multaVos, gPoli: 10 - b.poli + parte, multaVos, costoMulta });
  p.total += S;
  if (p.ronda === PLAZA_ASAMBLEA && !p.regla) p.fase = "asamblea";
  else if (p.ronda >= PLAZA_RONDAS) p.fase = "fin";
  p.ronda++;
}

const ULTIMATUM_RONDAS = 3;

const umbralesUltimatum = () => Array.from({
  length: ULTIMATUM_RONDAS
}, () => 10 + Math.floor(Math.random() * 8) * 5);

function jugarRondaUltimatum() {
  const s = state.ultimatum;
  if (!s || s.terminado) return;
  const umbral = s.umbrales[s.ronda - 1];
  const aceptado = s.oferta >= umbral;
  const jugadorGana = aceptado ? 100 - s.oferta : 0;
  const botGana = aceptado ? s.oferta : 0;
  s.historial.push({
    ronda: s.ronda,
    oferta: s.oferta,
    aceptado: aceptado,
    jugadorGana: jugadorGana,
    botGana: botGana
  });
  if (s.ronda >= ULTIMATUM_RONDAS) s.terminado = true; else {
    s.ronda++;
    s.oferta = 50;
  }
  refreshUnidad();
}

  const s = state.ultimatum || (state.ultimatum = {

  const historial = s.historial.length ? `\n      <table class="matriz" style="margin-top:10px;">\n        <tr><th>Ronda</th><th>Ofreciste</th><th>Resultado</th><th>Ganaste</th></tr>\n        ${s.historial.map(h => `<tr><td>${h.ronda}</td><td>$${h.oferta}</td><td>${h.aceptado ? "Aceptó" : "Rechazó"}</td><td>$${h.jugadorGana}</td></tr>`).join("")}\n      </table>` : "";
  if (!s.terminado) {
    return `\n        <div class="card">\n          <p style="margin-top:0;">Tenés $100 para repartir con un compañero (la cátedra). Vos proponés cuánto le das; si lo acepta, cada uno se queda con su parte. Si lo rechaza, <strong>los dos se quedan con $0</strong>. Jugás ${ULTIMATUM_RONDAS} rondas con compañeros distintos.</p>\n          <div style="margin-top:14px;">\n            <label style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;"><span id="ultimatum-label">Le ofrecés <span class="mono">$${s.oferta}</span> (vos te quedás con $${100 - s.oferta})</span></label>\n            <input type="range" id="ultimatum-oferta" min="0" max="100" step="5" value="${s.oferta}">\n          </div>\n          <div class="eyebrow" style="margin-top:10px;">Ronda ${s.ronda} de ${ULTIMATUM_RONDAS}</div>\n          <button class="btn block" data-ultimatum-proponer="1" style="margin-top:8px;">Proponer</button>\n        </div>\n        ${historial}`;
  }
  const totalGanado = s.historial.reduce((acc, h) => acc + h.jugadorGana, 0);
  return `\n      <div class="card">\n        <div class="eyebrow">Total que te llevaste: $${totalGanado}</div>\n      </div>\n      ${historial}\n      <div class="feedback ok" style="margin-top:12px;">\n        Si el otro fuera un "homo economicus" perfectamente racional y egoísta, debería aceptar cualquier oferta mayor a $0 (algo es mejor que nada), así que a vos te convendría quedarte con casi todo. Pero en experimentos reales con personas, las ofertas muy bajas (menos del 20-30% del total) se rechazan con frecuencia, aunque eso signifique que el que rechaza también pierda su parte: la gente parece valorar la equidad de la repartición, no solo el resultado numérico. Es uno de los ejemplos clásicos que usa la economía del comportamiento para cuestionar el supuesto de racionalidad estrictamente egoísta de los modelos más simples.\n      </div>\n      <button class="btn secondary" data-ultimatum-reiniciar="1">Jugar de nuevo</button>\n    `;
}

function tasasEPH(lista) {
  const n = lista.length, oc = lista.filter(x => x.estado === "ocupado").length, de = lista.filter(x => x.estado === "desocupado").length;
  const sub = lista.filter(x => x.estado === "ocupado" && x.sub).length, pea = oc + de;
  const pct = (a, b) => b ? fmt(a / b * 100, 1) + "%" : "—";
  return { actividad: pct(pea, n), empleo: pct(oc, n), desocupacion: pct(de, pea), subocupacion: pct(sub, pea) };
}

  const tuyas = tasasEPH(EPH_FICHAS.map((f, i) => s.resp[i])), buenas = tasasEPH(EPH_FICHAS.map(f => ({ estado: f.estado, sub: f.subocupado })));
  const aciertos = EPH_FICHAS.filter((f, i) => s.resp[i].estado === f.estado && (f.estado !== "ocupado" || !!s.resp[i].sub === !!f.subocupado)).length;

function fmt(n, d = 0) {
  return Number(n).toLocaleString("es-AR", {
    minimumFractionDigits: d,
    maximumFractionDigits: d
  });
}

function pesos(n, d = 0) {
  return "$" + fmt(n, d);
}

function limitar(x, a, b) {
  return Math.max(a, Math.min(b, x));
}

let CTX_MEDIR = null;

function medirTexto(t, bold, fs) {
  try {
    if (!CTX_MEDIR) CTX_MEDIR = document.createElement("canvas").getContext("2d");
    CTX_MEDIR.font = `${bold ? 700 : 400} ${fs}px Lato, system-ui, sans-serif`;
    return CTX_MEDIR.measureText(t).width + 2;
  } catch (e) {
    return t.length * fs * (bold ? .64 : .58);
  }
}

function grafico(o) {
  const W = o.W || 380, H = o.H || 250, ML = o.ML || 40, MR = 16, MT = o.ylabel ? 26 : 16, MB = 30;
  const pw = W - ML - MR, ph = H - MT - MB;
  const x0 = o.xmin || 0, y0 = o.ymin || 0;
  const sx = x => ML + (x - x0) / (o.xmax - x0) * pw;
  const sy = y => MT + ph - (y - y0) / (o.ymax - y0) * ph;
  const cx = x => limitar(sx(x), ML, ML + pw);
  const cy = y => limitar(sy(y), MT, MT + ph);
  const dentroPlot = (px, py) => px >= ML - .5 && px <= ML + pw + .5 && py >= MT - .5 && py <= MT + ph + .5;
  const clip = "g" + Math.random().toString(36).slice(2, 9);
  const d = pts => pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + "," + sy(p[1]).toFixed(1)).join(" ");
  const ocupado = [];
  const plano = t => String(t).replace(/<[^>]+>/g, "");
  const ancho = (t, bold, fs) => medirTexto(plano(t), bold, fs);
  const cajaTexto = (x, y, t, anchor, bold, fs) => {
    const w = ancho(t, bold, fs);
    const x1 = anchor === "end" ? x - w : anchor === "middle" ? x - w / 2 : x;
    return {
      x1: x1 - 1,
      y1: y - fs * .82,
      x2: x1 + w + 1,
      y2: y + fs * .22
    };
  };
  const choca = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
  const solape = (a, b) => Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)) * Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
  const enSvg = c => c.x1 >= 1 && c.x2 <= W - 1 && c.y1 >= 1 && c.y2 <= H - 1;
  const caja = (x1, y1, x2, y2) => ({
    x1: Math.min(x1, x2),
    y1: Math.min(y1, y2),
    x2: Math.max(x1, x2),
    y2: Math.max(y1, y2)
  });
  const registrarTrazo = pxs => {
    for (let i = 1; i < pxs.length; i++) {
      const [ax, ay] = pxs[i - 1], [bx, by] = pxs[i];
      const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 4));
      for (let k = 0; k <= n; k++) {
        const px = ax + (bx - ax) * k / n, py = ay + (by - ay) * k / n;
        if (dentroPlot(px, py)) ocupado.push(caja(px - 2, py - 2, px + 2, py + 2));
      }
    }
  };
  const halo = "paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;";
  const txt = (x, y, t, st = "", fs = 11) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${fs}px;${halo}${st}">${t}</text>`;
  const fijo = (x, y, t, anchor, bold, fs, st) => {
    ocupado.push(cajaTexto(x, y, t, anchor, bold, fs));
    return txt(x, y, t, `text-anchor:${anchor};${bold ? "font-weight:700;" : ""}${st}`, fs);
  };
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:Lato,system-ui,sans-serif;">`;
  s += `<defs><clipPath id="${clip}"><rect x="${ML}" y="${MT - 1}" width="${pw + 1}" height="${ph + 2}"/></clipPath></defs>`;
  let capaTextos = "";
  const pendientes = [];
  (o.areas || []).forEach(a => {
    s += `<path d="${d(a.pts)} Z" clip-path="url(#${clip})" style="fill:${a.color};opacity:${a.op ?? .18};stroke:none"/>`;
  });
  (o.barras || []).forEach(b => {
    const base = b.base ?? 0;
    const x1 = sx(b.x - b.ancho / 2), x2 = sx(b.x + b.ancho / 2);
    const ya = cy(Math.max(b.y, base)), yb = cy(Math.min(b.y, base));
    s += `<rect x="${x1.toFixed(1)}" y="${ya.toFixed(1)}" width="${(x2 - x1).toFixed(1)}" height="${Math.max(0, yb - ya).toFixed(1)}" style="fill:${b.color};opacity:${b.op ?? 1}"/>`;
    ocupado.push(caja(x1, ya, x2, yb));
    if (b.etiqueta) capaTextos += fijo((x1 + x2) / 2, ya - 4, b.etiqueta, "middle", true, 11, "fill:var(--ink);");
    if (b.abajo) capaTextos += fijo((x1 + x2) / 2, MT + ph + 14, b.abajo, "middle", false, 10.5, "fill:var(--ink-soft);");
  });
  (o.guiasV || []).forEach(g => {
    const X = cx(g.x), Ya = cy(g.y1 ?? y0), Yb = cy(g.y2 ?? o.ymax);
    s += `<line x1="${X.toFixed(1)}" y1="${Ya.toFixed(1)}" x2="${X.toFixed(1)}" y2="${Yb.toFixed(1)}" style="stroke:${g.color || "var(--ink-soft)"};stroke-width:1;stroke-dasharray:3 3"/>`;
    registrarTrazo([ [ X, Ya ], [ X, Yb ] ]);
    if (g.t) pendientes.push({
      t: g.t,
      color: g.color || "var(--ink-soft)",
      bold: false,
      prio: 3,
      cands: [ {
        x: X + 4,
        y: g.ty ?? MT + 10,
        a: "start"
      }, {
        x: X - 4,
        y: g.ty ?? MT + 10,
        a: "end"
      }, {
        x: X + 4,
        y: MT + 24,
        a: "start"
      }, {
        x: X - 4,
        y: MT + 24,
        a: "end"
      } ]
    });
  });
  (o.guiasH || []).forEach(g => {
    const Y = cy(g.y), Xa = cx(g.x1 ?? x0), Xb = cx(g.x2 ?? o.xmax);
    s += `<line x1="${Xa.toFixed(1)}" y1="${Y.toFixed(1)}" x2="${Xb.toFixed(1)}" y2="${Y.toFixed(1)}" style="stroke:${g.color || "var(--ink-soft)"};stroke-width:${g.w || 1};stroke-dasharray:${g.solida ? "none" : "3 3"}"/>`;
    registrarTrazo([ [ Xa, Y ], [ Xb, Y ] ]);
    if (g.t) {
      const izq = [ {
        x: Xa + 4,
        y: Y - 5,
        a: "start"
      }, {
        x: Xa + 4,
        y: Y + 13,
        a: "start"
      } ];
      const der = [ {
        x: Xb - 4,
        y: Y - 5,
        a: "end"
      }, {
        x: Xb - 4,
        y: Y + 13,
        a: "end"
      } ];
      const medio = [ .5, .25, .75 ].flatMap(f => [ {
        x: Xa + (Xb - Xa) * f,
        y: Y - 5,
        a: "middle"
      }, {
        x: Xa + (Xb - Xa) * f,
        y: Y + 13,
        a: "middle"
      } ]);
      const afuera = [ {
        x: Xb + 5,
        y: Y + 4,
        a: "start"
      }, {
        x: Xa - 5,
        y: Y + 4,
        a: "end"
      } ];
      pendientes.push({
        t: g.t,
        color: g.color || "var(--ink-soft)",
        bold: !!g.der || !!g.solida,
        prio: 3,
        cands: g.afuera ? [ ...afuera, ...izq, ...der, ...medio ] : g.der ? [ ...der, ...medio, ...izq, ...afuera ] : [ ...izq, ...der, ...medio, ...afuera ]
      });
    }
  });
  const yEje = sy(0 > y0 && 0 < o.ymax ? 0 : y0);
  s += `<line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + ph}" style="stroke:var(--ink);stroke-width:1"/>`;
  s += `<line x1="${ML}" y1="${yEje.toFixed(1)}" x2="${ML + pw}" y2="${yEje.toFixed(1)}" style="stroke:var(--ink);stroke-width:1"/>`;
  (o.xticks || []).forEach(t => {
    capaTextos += fijo(sx(t), MT + ph + 13, fmt(t), "middle", false, 10, "fill:var(--ink-soft);");
  });
  (o.yticks || []).forEach(t => {
    capaTextos += fijo(ML - 5, sy(t) + 3, fmt(t), "end", false, 10, "fill:var(--ink-soft);");
  });
  if (o.xlabel) capaTextos += fijo(ML + pw, H - 4, o.xlabel, "end", false, 11, "fill:var(--ink-soft);");
  if (o.ylabel) capaTextos += fijo(4, 12, o.ylabel, "start", false, 11, "fill:var(--ink-soft);");
  (o.series || []).forEach(se => {
    if (!se.pts || se.pts.length < 2) return;
    s += `<path d="${d(se.pts)}" clip-path="url(#${clip})" style="fill:none;stroke:${se.color};stroke-width:${se.w || 2.2};stroke-linejoin:round;${se.dash ? `stroke-dasharray:${se.dash};` : ""}${se.op ? `opacity:${se.op};` : ""}"/>`;
    const vis = [];
    for (let i = 1; i < se.pts.length; i++) {
      const [ax, ay] = [ sx(se.pts[i - 1][0]), sy(se.pts[i - 1][1]) ], [bx, by] = [ sx(se.pts[i][0]), sy(se.pts[i][1]) ];
      const n = Math.max(2, Math.ceil(Math.hypot(bx - ax, by - ay) / 3));
      for (let k = i === 1 ? 0 : 1; k <= n; k++) {
        const px = ax + (bx - ax) * k / n, py = ay + (by - ay) * k / n;
        if (dentroPlot(px, py)) vis.push([ px, py ]);
      }
    }
    registrarTrazo(vis);
    if (se.label && vis.length) {
      const cands = [];
      const alrededor = ([px, py]) => [ {
        x: px + 6,
        y: py - 6,
        a: "start"
      }, {
        x: px - 6,
        y: py - 6,
        a: "end"
      }, {
        x: px + 6,
        y: py + 14,
        a: "start"
      }, {
        x: px - 6,
        y: py + 14,
        a: "end"
      }, {
        x: px,
        y: py - 9,
        a: "middle"
      }, {
        x: px,
        y: py + 17,
        a: "middle"
      } ];
      if (se.labelEn) cands.push({
        x: sx(se.labelEn[0]) + (se.dx ?? 4),
        y: sy(se.labelEn[1]) + (se.dy ?? -5),
        a: se.anchor || "start"
      });
      [ .999, .88, .75, .6, .45, .3 ].forEach(f => cands.push(...alrededor(vis[Math.min(vis.length - 1, Math.floor(f * (vis.length - 1)))])));
      pendientes.push({
        t: se.label,
        color: se.color,
        bold: true,
        prio: 2,
        cands: cands
      });
    }
  });
  (o.puntos || []).forEach(p => {
    const X = cx(p.x), Y = cy(p.y), r = p.r || 5;
    s += `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${r}" style="fill:${p.color || "var(--blue)"};stroke:#fff;stroke-width:1.5"/>`;
    ocupado.push(caja(X - r - 1, Y - r - 1, X + r + 1, Y + r + 1));
    if (p.t) {
      const cands = [];
      if (p.dx !== undefined || p.dy !== undefined) cands.push({
        x: X + (p.dx ?? 8),
        y: Y + (p.dy ?? -8),
        a: p.anchor || "start"
      });
      cands.push({
        x: X + 9,
        y: Y - 8,
        a: "start"
      }, {
        x: X - 9,
        y: Y - 8,
        a: "end"
      }, {
        x: X + 9,
        y: Y + 15,
        a: "start"
      }, {
        x: X - 9,
        y: Y + 15,
        a: "end"
      }, {
        x: X + 11,
        y: Y + 4,
        a: "start"
      }, {
        x: X - 11,
        y: Y + 4,
        a: "end"
      }, {
        x: X,
        y: Y - 11,
        a: "middle"
      }, {
        x: X,
        y: Y + 19,
        a: "middle"
      }, {
        x: X + 9,
        y: Y - 22,
        a: "start"
      }, {
        x: X - 9,
        y: Y - 22,
        a: "end"
      }, {
        x: X + 9,
        y: Y + 29,
        a: "start"
      }, {
        x: X - 9,
        y: Y + 29,
        a: "end"
      }, {
        x: X + 9,
        y: Y - 36,
        a: "start"
      }, {
        x: X - 9,
        y: Y - 36,
        a: "end"
      }, {
        x: X - 16,
        y: Y - 50,
        a: "end"
      }, {
        x: X + 16,
        y: Y - 50,
        a: "start"
      });
      pendientes.push({
        t: p.t,
        color: p.color || "var(--blue)",
        bold: true,
        prio: 1,
        cands: cands
      });
    }
  });
  (o.textos || []).forEach(t => {
    capaTextos += fijo(sx(t.x), sy(t.y), t.t, t.anchor || "middle", !!t.bold, 11, `fill:${t.color || "var(--ink)"};`);
  });
  pendientes.sort((a, b) => a.prio - b.prio).forEach(e => {
    let mejor = null, mejorCosto = Infinity;
    for (const c of e.cands) {
      const bx = cajaTexto(c.x, c.y, e.t, c.a, e.bold, 11);
      if (!enSvg(bx)) continue;
      const costo = ocupado.reduce((acc, o2) => acc + solape(bx, o2), 0);
      if (costo === 0) {
        mejor = {
          c: c,
          bx: bx
        };
        mejorCosto = 0;
        break;
      }
      if (costo < mejorCosto) {
        mejor = {
          c: c,
          bx: bx
        };
        mejorCosto = costo;
      }
    }
    if (!mejor) {
      const c = e.cands[0];
      mejor = {
        c: c,
        bx: cajaTexto(c.x, c.y, e.t, c.a, e.bold, 11)
      };
    }
    ocupado.push(mejor.bx);
    capaTextos += txt(mejor.c.x, mejor.c.y, e.t, `fill:${e.color};text-anchor:${mejor.c.a};${e.bold ? "font-weight:700;" : ""}`);
  });
  s += capaTextos + `</svg>`;
  return s;
}

function recta(x1, y1, x2, y2) {
  return [ [ x1, y1 ], [ x2, y2 ] ];
}

function curva(f, a, b, n = 60) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = a + (b - a) * i / n;
    pts.push([ x, f(x) ]);
  }
  return pts;
}

}

function valorSlider(s, v) {
  return s.fmt ? s.fmt(v) : fmt(v, s.dec || 0);
}

function renderSim(def) {
  if (!state.sims) state.sims = {};
  const v = state.sims[def.id] || (state.sims[def.id] = JSON.parse(JSON.stringify(def.inicial)));
  SIM_ACTIVO = def;
  const visible = x => !x.si || x.si(v);
  const toggles = (def.toggles || []).filter(visible).map(t => `\n      <div class="sim-grupo">\n        <div class="sim-lbl">${t.label}</div>\n        <div class="chips-fila">${t.opciones.map(([val, lab]) => `<button class="chip-btn ${String(v[t.k]) === String(val) ? "activo" : ""}" data-sim-tog="${t.k}" data-v="${val}">${lab}</button>`).join("")}</div>\n      </div>`).join("");
  const sliders = (def.sliders || []).filter(visible).map(s => `\n      <div class="sim-grupo">\n        <label class="sim-lbl sim-lbl-fila">${s.label} <span class="mono" id="simv-${s.k}">${valorSlider(s, v[s.k])}</span></label>\n        <input type="range" data-sim-slider="${s.k}" min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${v[s.k]}">\n      </div>`).join("");
  const acciones = (def.acciones || []).filter(visible).length ? `<div class="chips-fila" style="margin-top:6px;">${def.acciones.filter(visible).map(a => `<button class="btn ${a.sec ? "secondary" : ""}" data-sim-accion="${a.k}">${a.label}</button>`).join("")}</div>` : "";
  const controles = toggles + sliders + acciones;
  return `\n      ${def.intro ? `<div class="card sim-intro">${def.intro}</div>` : ""}\n      <div class="card sim-out" id="sim-out">${def.dibujar(v)}</div>\n      ${controles ? `<div class="card">${controles}</div>` : ""}\n      ${def.pie ? `<div class="card sim-pie">${typeof def.pie === "function" ? def.pie(v) : def.pie}</div>` : ""}`;
}

function actualizarSim() {
  const def = SIM_ACTIVO;
  if (!def) return;
  const v = state.sims[def.id];
  const out = document.getElementById("sim-out");
  if (out) out.innerHTML = def.dibujar(v);
  (def.sliders || []).forEach(s => {
    const el = document.getElementById("simv-" + s.k);
    if (el) el.textContent = valorSlider(s, v[s.k]);
  });
}

function bindSim() {
  const def = SIM_ACTIVO;
  if (!def || !document.getElementById("sim-out")) return;
  const v = state.sims[def.id];
  document.querySelectorAll("[data-sim-slider]").forEach(el => {
    el.oninput = e => {
      v[el.dataset.simSlider] = +e.target.value;
      v._ult = el.dataset.simSlider;
      actualizarSim();
    };
  });
  document.querySelectorAll("[data-sim-tog]").forEach(b => {
    b.onclick = () => {
      const crudo = b.dataset.v;
      v[b.dataset.simTog] = crudo !== "" && !isNaN(+crudo) ? +crudo : crudo;
      v._ult = b.dataset.simTog;
      if (def.alCambiar) def.alCambiar(v, b.dataset.simTog);
      refreshUnidad();
    };
  });
  document.querySelectorAll("[data-sim-accion]").forEach(b => {
    b.onclick = () => {
      if (b.dataset.simAccion === "reiniciar") state.sims[def.id] = JSON.parse(JSON.stringify(def.inicial)); else def.accion(v, b.dataset.simAccion);
      refreshUnidad();
    };
  });
}

function mezclarOpciones(it) {
  const idx = it.opciones.map((_, i) => i);
  const orden = mezclar(idx);
  return {
    ...it,
    opciones: orden.map(i => it.opciones[i]),
    correcta: orden.indexOf(it.correcta)
  };
}

function preparar(items, op = {}) {
  let out = items.slice();
  if (op.opciones) out = out.map(mezclarOpciones);
  if (op.orden) out = mezclar(out);
  if (op.sinRachas) {
    const racha = arr => arr.some((x, i) => i >= op.sinRachas && arr.slice(i - op.sinRachas, i + 1).every(y => y.correcta === x.correcta));
    for (let k = 0; k < 500 && racha(out); k++) out = mezclar(out);
  }
  return out;
}

const SUBS = 10, PROD = 25, SIND = 16;

function salarioMercado(v) {
  if (v.sind === "si") return Math.max(SIND, v.trab > v.puestos ? SUBS : Math.min(PROD, SUBS + (v.puestos - v.trab) / v.puestos * 30));
  if (v.trab >= v.puestos) return SUBS;
  return Math.min(PROD, SUBS + (v.puestos - v.trab) / v.puestos * 30);
}

function fabricaSVG(v) {
  const empleados = Math.min(v.trab, v.puestos), afuera = Math.max(0, v.trab - v.puestos);
  const persona = (x, y, col) => `<circle cx="${x}" cy="${y - 11}" r="3.3" fill="${col}"/><path d="M${x - 4},${y} V${y - 5} Q${x - 4},${y - 8} ${x},${y - 8} Q${x + 4},${y - 8} ${x + 4},${y - 5} V${y} Z" fill="${col}"/>`;
  let s = `<svg viewBox="0 0 380 206" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:Lato,system-ui,sans-serif;">`;
  const sal = salarioMercado(v), xs = x => 40 + x / PROD * 300;
  s += `<text x="10" y="14" style="font-size:11px;fill:var(--ink-soft)">Salario diario</text>`;
  s += `<rect x="40" y="22" width="300" height="10" rx="5" fill="#EDF2F8"/>`;
  s += `<rect x="40" y="22" width="${(xs(sal) - 40).toFixed(1)}" height="10" rx="5" fill="${sal <= SUBS + .01 ? "var(--rojo)" : "var(--verde)"}"/>`;
  s += `<path d="M${xs(SUBS)},18 V36" stroke="var(--rojo)" stroke-width="2"/><text x="${xs(SUBS)}" y="48" text-anchor="middle" style="font-size:10px;fill:var(--rojo);font-weight:700">subsistencia (${SUBS})</text>`;
  s += `<path d="M${xs(PROD)},18 V36" stroke="var(--ink-soft)" stroke-width="1.5"/><text x="${xs(PROD) + 2}" y="13" text-anchor="end" style="font-size:10px;fill:var(--ink-soft)">lo que produce cada uno (${PROD})</text>`;
  s += `<text x="${Math.min(xs(sal) + 6, 318)}" y="31" style="font-size:11px;font-weight:900;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px">${fmt(sal, 1)}</text>`;
  s += `<path d="M196,194 V82 L222,64 V82 L248,64 V82 L274,64 V82 L300,64 V82 L326,64 V82 L352,64 V194 Z" fill="#EEF3F8" stroke="var(--ink)" stroke-width="1.4"/>`;
  s += `<text x="274" y="100" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:var(--ink-soft)">ADENTRO: ${empleados} de ${v.puestos}</text>`;
  if (v.sind === "si") s += `<text x="274" y="87" text-anchor="middle" style="font-size:9px;font-style:italic;font-weight:700;fill:var(--blue);paint-order:stroke;stroke:#EEF3F8;stroke-width:3px">insiders</text>`;
  for (let i = 0; i < v.puestos; i++) {
    const col = i % 10, fila = Math.floor(i / 10);
    const x = 207 + col * 14.4, y = 124 + fila * 18;
    s += i < empleados ? persona(x, y, "var(--blue)") : `<circle cx="${x}" cy="${y - 7}" r="4" fill="none" stroke="var(--ocre)" stroke-width="1.3" stroke-dasharray="2 2"/>`;
  }
  s += `<text x="92" y="100" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:var(--ink-soft)">EN LA PUERTA: ${afuera}</text>`;
  if (v.sind === "si") s += `<text x="92" y="88" text-anchor="middle" style="font-size:9.5px;font-style:italic;fill:var(--ink-soft)">outsiders</text>`;
  for (let i = 0; i < afuera; i++) {
    const col = i % 10, fila = Math.floor(i / 10);
    s += persona(16 + col * 17, 124 + fila * 17, "var(--ink-soft)");
  }
  s += `<path d="M10,194 H370" stroke="var(--ink)" stroke-width="1"/>`;
  return s + `</svg>`;
}

const SIM_HIERRO = {

  intro: `<p class="sub" style="margin:0;">Manchester, 1820. Cada mañana, en la puerta de la fábrica, se juntan los que buscan trabajo. Los patrones son pocos; los trabajadores, muchos. Los patrones toman a los que piden menos. Vos sos uno de los que esperan en la puerta.</p>`,
  inicial: {

    puestos: 20,
    pedido: 14,
    sind: "no"
  },
  toggles: [ {
    k: "sind",
    label: "¿Los trabajadores pueden negociar juntos?",

  } ],
  sliders: [ {

    si: v => v.sind === "no"
  }, {
    k: "trab",
    label: "Trabajadores buscando empleo",
    min: 8,
    max: 50
  }, {
    k: "puestos",
    label: "Puestos que ofrecen los patrones",
    min: 8,
    max: 40
  } ],
  acciones: [ {
    k: "gen",
    label: "Pasa una generación"
  }, {
    k: "reiniciar",
    label: "Empezar de nuevo",
    sec: true
  } ],
  accion(v, k) {
    if (k !== "gen") return;
    const w = salarioMercado(v);
    if (w > SUBS + .01) v.trab = Math.min(50, Math.round(v.trab * (1 + .6 * (w - SUBS) / SUBS)));
    v.generaciones = (v.generaciones || 0) + 1;
  },
  dibujar(v) {
    const w = salarioMercado(v), sobran = v.trab - v.puestos;
    let tuSuerte = "";
    if (v.sind === "no") {
      if (v.pedido < SUBS) tuSuerte = `Pedís ${fmt(v.pedido)}, por debajo de la subsistencia: con eso no podés comer ni pagar un techo. Nadie puede aceptar menos de ${SUBS} por mucho tiempo, y por eso el salario no baja de ahí.`; else if (sobran > 0 && v.pedido > SUBS) tuSuerte = `<strong>No te toman.</strong> Pedís ${fmt(v.pedido)}, pero en la puerta hay ${sobran} personas más de las que hacen falta, y todas aceptan ${SUBS}. El patrón elige a otro.`; else if (sobran > 0) tuSuerte = `Pedís ${SUBS}, lo mismo que todos. Entrás solo si tenés suerte: hay ${v.trab} personas para ${v.puestos} puestos.`; else if (sobran === 0 && v.pedido <= w + .01) tuSuerte = `<strong>Te toman</strong> al salario de subsistencia: no sobra nadie, pero tampoco falta, así que nadie tiene que pagar más.`; else if (v.pedido <= w + .01) tuSuerte = `<strong>Te toman.</strong> Faltan trabajadores, así que los patrones compiten por ustedes y hoy pagan ${fmt(w, 1)}.`; else tuSuerte = `Pedís ${fmt(v.pedido)} y hoy los patrones pagan como mucho ${fmt(w, 1)}: te quedás afuera.`;
    }
    let expl;
    if (v.sind === "si") {
      expl = sobran > 0 ? `<strong>Con sindicato, la rigidez cambia de lado.</strong> Nadie puede ofrecerse por menos de lo acordado (${SIND}), así que el salario no baja aunque sobren ${sobran} trabajadores. Pero esos ${sobran} se quedan sin empleo: ahora el salario no baja y el ajuste lo hace el desempleo. Es la rigidez a la baja que vas a ver en la Parte IV, en la visión keynesiana del mercado de trabajo.<br><br><strong>Insiders y outsiders.</strong> Assar Lindbeck y Dennis Snower (años 80) lo llamaron así: los de adentro (<em>insiders</em>) negocian y defienden su salario, porque reemplazarlos le cuesta a la empresa (buscar, contratar, capacitar, conflictos); los de la puerta (<em>outsiders</em>) no pueden entrar ofreciéndose más baratos. El salario de adentro queda alto y el desempleo de afuera se vuelve persistente: la rigidez ya no la sufren los ocupados, la sufren los que esperan.` : `Faltan trabajadores: los patrones pagan ${fmt(w, 1)}, más de lo acordado por el sindicato.`;
    } else if (sobran > 0) {
      expl = `<strong>El salario queda clavado en la subsistencia.</strong> Sobran ${sobran} trabajadores. Cada uno prefiere cobrar un poco menos antes que quedarse sin nada, así que se van bajando el precio entre ellos hasta el mínimo con el que se puede vivir: ${SUBS}. De ahí no baja, porque nadie puede vivir con menos, pero tampoco sube: el que pide más es reemplazado por otro que espera en la puerta. Esa es la <strong>rigidez</strong> de la ley de hierro. Y fijate: cada trabajador produce ${PROD}, pero cobra ${SUBS}. La diferencia queda como ganancia del patrón.`;
    } else if (sobran === 0) {
      expl = `<strong>Justo alcanzan los puestos:</strong> no sobra nadie en la puerta, pero tampoco falta gente, así que ningún patrón tiene que ofrecer más para conseguir trabajadores: el salario queda en la subsistencia. Probá con menos trabajadores (una peste, una emigración) o con más puestos.`;
    } else {
      expl = `<strong>Faltan trabajadores</strong> (hay ${-sobran} puestos vacíos), así que los patrones compiten por ellos y el salario sube a ${fmt(w, 1)}. Parece que la ley de hierro se rompió… Tocá <em>"Pasa una generación"</em>: con mejores salarios las familias crecen, llegan más trabajadores a la puerta y el sobrante vuelve.`;
    }
    if (v.generaciones && v.sind === "no" && sobran > 0) expl += `<br><br>Pasaron ${v.generaciones} ${v.generaciones === 1 ? "generación" : "generaciones"}. Por eso para Ricardo y Malthus el sobrante de trabajadores era permanente: cada vez que el salario sube, la población crece y lo vuelve a empujar al mínimo.`;
    return fabricaSVG(v) + datos([ [ "Salario", fmt(w, 1), w <= SUBS + .01 ? "malo" : "" ], [ "Sin trabajo", Math.max(0, sobran), sobran > 0 ? "malo" : "" ], [ "Produce cada uno", PROD ] ]) + (tuSuerte ? `<div class="feedback" style="border-color:var(--blue);background:var(--blue-soft);">${tuSuerte}</div>` : "") + `<div class="feedback ${sobran > 0 && v.sind === "no" ? "bad" : "ok"}">${expl}</div>`;
  },
  pie: `<p style="margin:0 0 8px;font-size:13.5px;"><strong>¿Por qué el trabajador pierde siempre la pulseada?</strong> Adam Smith ya lo explicaba en 1776: los patrones son pocos y se ponen de acuerdo fácilmente, y la ley se lo permite, mientras que a los obreros les prohíbe asociarse. Además, un patrón puede vivir un año o dos de lo que ya tiene sin contratar a nadie. En cambio, muchos obreros no aguantarían una semana sin trabajo, pocos un mes y casi ninguno un año. En Inglaterra, las <em>Combination Acts</em> (1799-1824) prohibían a los trabajadores asociarse.</p>\n      <p style="margin:0;font-size:13.5px;">El nombre "ley de hierro" (o "de bronce") de los salarios se lo puso Ferdinand Lassalle en el siglo XIX a una idea de Ricardo y Malthus. La historia la desmintió en parte: desde la revolución industrial la productividad creció mucho más rápido que la población, y los sindicatos cambiaron la relación de fuerzas.</p>`

const COSTO_CAMPO = 600;

function rentaEstado(v) {
  const sembrados = v.pobl === "si" ? CAMPOS : CAMPOS.slice(0, 3);
  const marginal = sembrados[sembrados.length - 1];

    marginal: marginal,
    precio: precio
  };
}

const SIM_RENTA = {
  id: "renta",
  intro: `<p class="sub" style="margin:0;">Sos un chacarero. No tenés tierra: la tenés que arrendar. Hay campos de distinta fertilidad, y sembrar cualquiera cuesta lo mismo: ${pesos(COSTO_CAMPO)} de trabajo, semillas y herramientas, incluida la ganancia normal que necesitás para que te convenga sembrar. La diferencia es cuánto trigo da cada uno. Elegí un campo y ofrecele al dueño un arriendo. Hay otros chacareros que también lo quieren.</p>`,
  inicial: {
    campo: "A",
    oferta: 200,
    pobl: "no"
  },
  toggles: [ {
    k: "campo",
    label: "¿Qué campo querés arrendar?",
    opciones: CAMPOS.map(c => [ c.id, `${c.id} · ${c.q} quintales` ])
  }, {
    k: "pobl",
    label: "Población",
    opciones: [ [ "no", "Alcanza con sembrar A, B y C" ], [ "si", "Creció: hay que sembrar también D" ] ]
  } ],
  sliders: [ {
    k: "oferta",
    label: "Arriendo que le ofrecés al dueño",
    min: 0,
    max: 1200,
    step: 50,
    fmt: v => pesos(v)
  } ],
  dibujar(v) {
    const {sembrados: sembrados, marginal: marginal, precio: precio} = rentaEstado(v);
    const c = CAMPOS.find(x => x.id === v.campo);
    const sembrado = sembrados.includes(c);
    const ingreso = c.q * precio, renta = ingreso - COSTO_CAMPO;
    const barras = [];
    CAMPOS.forEach((x, i) => {
      const on = sembrados.includes(x), ing = x.q * precio;
      barras.push({
        x: i + 1,
        y: Math.min(COSTO_CAMPO, ing),
        ancho: .62,
        color: on ? "var(--ink-soft)" : "var(--rule)",
        op: on ? .5 : 1,
        abajo: `Campo ${x.id}`
      });
      if (on && ing > COSTO_CAMPO) barras.push({
        x: i + 1,
        y: ing,
        base: COSTO_CAMPO,
        ancho: .62,
        color: "var(--verde)",
        etiqueta: pesos(ing - COSTO_CAMPO)
      });
      if (!on) barras.push({
        x: i + 1,
        y: ing,
        base: 0,
        ancho: .62,
        color: "var(--rule)",
        etiqueta: "no se siembra"
      });
    });
    const i = CAMPOS.indexOf(c) + 1;
    const g = grafico({
      H: 240,
      xmin: .3,
      xmax: 4.7,
      ymax: 1800,
      ylabel: "$ por campo (trigo × precio)",
      yticks: [ 0, 600, 1200, 1800 ],
      barras: barras,
      guiasH: [ {
        y: COSTO_CAMPO,
        color: "var(--ink)",
        t: "costo de sembrar"
      }, ...sembrado ? [ {
        y: COSTO_CAMPO + v.oferta,
        x1: i - .45,
        x2: i + .45,
        color: "var(--rojo)",
        solida: true,
        w: 3
      } ] : [] ]
    });
    let veredicto, cls = "ok";
    if (!sembrado) {
      veredicto = `<strong>El campo ${c.id} no se siembra.</strong> Con el trigo a ${pesos(precio)}, da ${c.q} quintales × ${pesos(precio)} = ${pesos(ingreso)}, menos que los ${pesos(COSTO_CAMPO)} que cuesta sembrarlo. Probá con la opción de que creció la población.`;
      cls = "bad";
    } else if (renta <= 0) {
      veredicto = `<strong>El campo ${c.id} es el campo marginal:</strong> el peor que todavía se siembra. Da justo para cubrir los costos (${c.q} × ${pesos(precio)} = ${pesos(ingreso)}), así que nadie paga por arrendarlo: su renta es cero. Y es este campo el que fija el precio del trigo, porque si el precio fuera menor nadie lo sembraría y faltaría trigo.`;
    } else if (v.oferta < renta - 25) {
      veredicto = `<strong>Otro chacarero te gana el campo.</strong> El ${c.id} da ${pesos(ingreso)} de trigo y cuesta ${pesos(COSTO_CAMPO)} sembrarlo: sobran ${pesos(renta)}. A cualquiera le conviene ofrecer más que tus ${pesos(v.oferta)}, porque igual gana más que sembrando el campo marginal. Subí tu oferta.`;
      cls = "bad";
    } else if (v.oferta > renta + 25) {
      veredicto = `<strong>Te quedás con el campo, pero perdés plata.</strong> Pagás ${pesos(v.oferta)} por un campo que rinde solo ${pesos(renta)} más que el marginal. Te hubiera convenido arrendar el campo ${marginal.id}, que no cobra arriendo.`;
      cls = "bad";
    } else {
      veredicto = `<strong>Llegaste al equilibrio: ${pesos(renta)}.</strong> Ofreciendo eso te quedás con el campo, pero ya te da lo mismo que arrendar el campo marginal: todo lo que el ${c.id} rinde de más por ser más fértil se lo pagás al dueño. <strong>Eso es la renta diferencial.</strong>`;
    }
    const leyenda = `<div class="leyenda"><span><span style="color:var(--ink-soft)">■</span> costo de sembrar</span><span><span style="color:var(--verde)">■</span> lo que sobra: la renta</span>${sembrado ? `<span><span style="color:var(--rojo)">━</span> tu oferta (${pesos(v.oferta)})</span>` : ""}</div>`;
    return g + leyenda + datos([ [ "Precio del trigo", pesos(precio) + " (lo fija el campo " + marginal.id + ")" ], [ `Campo ${c.id}: da`, `${c.q} quintales = ${pesos(ingreso)}` ], [ "Renta de equilibrio", sembrado ? pesos(Math.max(0, renta)) : "—" ] ]) + `<div class="feedback ${cls}">${veredicto}</div>`;
  },
  pie: `<p style="margin:0 0 8px;font-size:13.5px;"><strong>¿Por qué la tierra fértil cobra renta?</strong> Todo el trigo se vende al mismo precio, y ese precio tiene que cubrir el costo del peor campo que hace falta sembrar. En un campo más fértil, el mismo trabajo y el mismo capital dan más trigo, así que queda un sobrante. Todos los chacareros quieren ese campo, y compiten ofreciendo más arriendo hasta que les da lo mismo arrendar el fértil o el peor. Así, el sobrante entero termina en manos del dueño. La renta no la crea el terrateniente: nace de la diferencia de fertilidad y se la queda quien es dueño.</p>\n      <p style="margin:0;font-size:13.5px;"><strong>Y cuando crece la población</strong> (probá la opción), hay que sembrar un campo peor, el precio del trigo sube y <em>todas</em> las rentas suben, sin que los dueños hagan nada distinto. Por eso David Ricardo (1817) decía que la renta no encarece el trigo: el trigo es caro porque hay que sembrar tierras peores, y por eso existe la renta. De ahí su defensa de importar trigo libremente: con trigo barato de afuera no hacía falta sembrar tierras peores. Las Leyes de Granos, que lo impedían, se derogaron en Inglaterra en 1846.</p>`
};

const anioTxt = a => a < 0 ? `${-a} a. C.` : String(a);

function lineaDeTiempo(vj) {
  const n = VIAJE.length, x = i => 16 + i * (328 / (n - 1));
  let s = `<svg viewBox="0 0 360 62" xmlns="http://www.w3.org/2000/svg" class="viaje-linea" style="width:100%;height:auto;display:block;font-family:Lato,system-ui,sans-serif;">`;
  s += `<path d="M${x(0)},26 H${x(n - 1)}" stroke="var(--rule)" stroke-width="4" stroke-linecap="round"/>`;
  s += `<path d="M${x(0)},26 H${x(vj.i)}" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>`;
  VIAJE.forEach((p, i) => {
    const r = vj.resp[i], hecho = r !== undefined, bien = hecho && r === p.ok;
    const fill = i === vj.i ? "#fff" : hecho ? bien ? "var(--verde)" : "var(--rojo)" : i < vj.i ? "var(--blue)" : "#fff";
    const stroke = i === vj.i ? "var(--blue)" : hecho ? fill : i < vj.i ? "var(--blue)" : "var(--rule)";
    const arriba = i % 2 === 0;
    s += `<g data-viaje-ir="${i}" style="cursor:pointer">\n        <circle cx="${x(i)}" cy="26" r="${i === vj.i ? 9 : 7}" style="fill:${fill};stroke:${stroke};stroke-width:${i === vj.i ? 3 : 2}"/>\n        <text x="${x(i)}" y="29.5" text-anchor="middle" style="font-size:9px;font-weight:900;fill:${i === vj.i ? "var(--blue)" : hecho || i < vj.i ? "#fff" : "var(--ink-soft)"}">${i + 1}</text>\n        <text x="${i === 0 ? x(i) - 8 : i === n - 1 ? x(i) + 8 : x(i)}" y="${arriba ? 10 : 50}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" style="font-size:8.5px;fill:${i === vj.i ? "var(--blue)" : "var(--ink-soft)"};font-weight:${i === vj.i ? 900 : 400}">${anioTxt(p.anio)}</text>\n        <circle cx="${x(i)}" cy="26" r="14" style="fill:transparent"/>\n      </g>`;
  });
  return s + `</svg>`;
}

function tonoEpoca(i) {
  const t = i / (VIAJE.length - 1);
  const a = [ 247, 239, 226 ], b = [ 238, 244, 250 ];
  return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * t)).join(",")})`;
}

function renderViajeU2() {
  const vj = state.viaje || (state.viaje = {
    i: 0,
    resp: {}
  });
  const p = VIAJE[vj.i];
  const r = vj.resp[vj.i];
  const aciertos = Object.entries(vj.resp).filter(([i, x]) => x === VIAJE[i].ok).length;
  const final = Object.keys(vj.resp).length === VIAJE.length;
  const recorrido = p.anio - VIAJE[0].anio - (p.anio > 0 && VIAJE[0].anio < 0 ? 1 : 0);
  return `\n      ${lineaDeTiempo(vj)}\n      <div class="viaje-estado">Parada ${vj.i + 1} de ${VIAJE.length} · <strong>${p.lugar}, ${anioTxt(p.anio)}</strong>${vj.i ? ` · viajaste ${fmt(recorrido)} años desde Atenas` : " · el punto de partida"}</div>\n      <div class="card viaje-card" style="background:${tonoEpoca(vj.i)};">\n        ${ILUS[p.ilus]()}\n        <div class="viaje-era">${p.era}</div>\n        <h3 class="viaje-quien">${p.quien}</h3>\n        <div class="viaje-idea">${p.idea}</div>\n        <p style="font-size:14px;line-height:1.6;margin-bottom:0;">${p.texto}</p>\n      </div>\n      <div class="card">\n        <p style="margin:0 0 10px;font-weight:700;">${p.preg}</p>\n        <div class="options">${p.ops.map((o, i) => {
    let cls = "opt";
    if (r !== undefined) {
      if (i === p.ok) cls += " correct"; else if (i === r) cls += " incorrect";
    }
    return `<button class="${cls}" data-viaje-op="${i}" ${r !== undefined ? "disabled" : ""}>${o}</button>`;
  }).join("")}</div>\n        ${r !== undefined ? `<div class="feedback ${r === p.ok ? "ok" : "bad"}">${p.por}</div>` : ""}\n      </div>\n      <div class="viaje-nav">\n        <button class="btn secondary" data-viaje-ir="${vj.i - 1}" ${vj.i === 0 ? "disabled" : ""}>‹ Parada anterior</button>\n        ${vj.i < VIAJE.length - 1 ? `<button class="btn" data-viaje-ir="${vj.i + 1}">Siguiente parada: ${anioTxt(VIAJE[vj.i + 1].anio)} ›</button>` : `<button class="btn" data-viaje-reiniciar="1">Volver a empezar</button>`}\n      </div>\n      ${final ? `<div class="feedback ok" style="margin-top:12px;"><strong>Terminaste el viaje: ${fmt(VIAJE[VIAJE.length - 1].anio - VIAJE[0].anio - 1)} años en ${VIAJE.length} paradas, ${aciertos} de ${VIAJE.length} respuestas bien.</strong> Fijate el hilo: del precio justo de Aristóteles y los escolásticos, al valor-trabajo de los clásicos y de Marx, y de ahí a la utilidad marginal. Y de la riqueza como oro, a la tierra, al trabajo. Cada escuela le discute algo a la anterior.</div>` : ""}`;
}

function bindViajeU2() {
  const vj = state.viaje;
  if (!vj) return;
  document.querySelectorAll("[data-viaje-ir]").forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.viajeIr;
      if (i >= 0 && i < VIAJE.length && i !== vj.i) {
        vj.i = i;
        refreshUnidad();
        irAlDetalle();
      }
    };
  });
  document.querySelectorAll("[data-viaje-op]").forEach(b => {
    b.onclick = () => {
      vj.resp[vj.i] = +b.dataset.viajeOp;
      refreshUnidad();
    };
  });
  const re = document.querySelector("[data-viaje-reiniciar]");
  if (re) re.onclick = () => {
    state.viaje = {
      i: 0,
      resp: {}
    };
    refreshUnidad();
    irAlDetalle();
  };
}

const CRISIS_FINAL_MEZ = (() => {

    ops: o.map(i => CRISIS_FINAL.ops[i]),
    ok: o.indexOf(0)
  };
})();

function dialogoHTML(d) {
  return `<div class="dialogo">${d.map(x => `\n      <div class="globo">\n        ${retrato(x.tipo)}\n        <div class="globo-cuerpo">\n          <div class="globo-quien">${x.quien}<span>${x.rol}</span></div>\n          <div class="globo-dice">“${x.dice}”</div>\n        </div>\n      </div>`).join("")}</div>`;
}

const GRIS_CRISIS = [ .55, .85, 1, 1, .7 ], GRIS_FINAL = .1;

function tonoGris(g) {
  const a = [ 247, 243, 236 ], b = [ 232, 231, 229 ];
  return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * g)).join(",")})`;
}

function renderCrisis30U2() {
  const c = state.crisis || (state.crisis = {
    paso: 0,
    elig: {},
    final: undefined
  });
  const g = c.paso >= CRISIS30.length ? GRIS_FINAL : GRIS_CRISIS[c.paso];
  return `<div class="epoca-gris" style="--gris:${g};">${renderCrisis30Interno(c, g)}</div>`;
}

function renderCrisis30Interno(c, g) {
  const total = CRISIS30.length + 1;
  const riel = `<div class="viaje-riel">${Array.from({
    length: total
  }, (_, i) => `<span class="viaje-parada ${i === c.paso ? "actual" : ""} ${i < c.paso ? "bien" : ""}"><span>${i + 1}</span></span>`).join("")}</div>`;
  if (c.paso >= CRISIS30.length) {
    const f = CRISIS_FINAL_MEZ, r = c.final;
    return `${riel}\n        <div class="card viaje-card" style="background:${tonoGris(g)};">\n          ${ILUS[f.ilus]()}\n          <div class="viaje-era">1929 · 1971</div>\n          <h3 class="viaje-quien">${f.titulo}</h3>\n          <p style="font-size:14px;line-height:1.6;margin-bottom:0;">${f.texto}</p>\n        </div>\n        <div class="card">\n          <p style="margin:0 0 10px;font-weight:700;">${f.preg}</p>\n          <div class="options">${f.ops.map((o, i) => {
      let cls = "opt";
      if (r !== undefined) {
        if (i === f.ok) cls += " correct"; else if (i === r) cls += " incorrect";
      }
      return `<button class="${cls}" data-crisis-final="${i}" ${r !== undefined ? "disabled" : ""}>${o}</button>`;
    }).join("")}</div>\n          ${r !== undefined ? `<div class="feedback ${r === f.ok ? "ok" : "bad"}">${f.por}</div>` : ""}\n        </div>\n        ${r !== undefined ? `<div class="card" style="font-size:14px;line-height:1.6;"><strong>Lo que dejó la crisis.</strong> Terminó con la idea de que el mercado se corrige solo y rápido (de ahí la revolución keynesiana), con el patrón oro y con el libre comercio de antes de la guerra. En la Argentina, que la recibió por el comercio, terminó con el modelo agroexportador puro: empezaron la industrialización por sustitución de importaciones y un Estado que regula precios, cambios y crédito (las juntas reguladoras en 1933, el Banco Central en 1935). Es el paso al capitalismo reglamentario de Lajugie.</div>\n          <button class="btn block" data-crisis-reiniciar="1">Volver a vivirla</button>` : ""}`;
  }
  const p = CRISIS30[c.paso];
  const e = c.elig[c.paso];
  return `${riel}\n      <div class="card viaje-card" style="background:${tonoGris(g)};">\n        ${ILUS[p.ilus]()}\n        <div class="viaje-era">${p.lugar} · ${p.fecha}</div>\n        <h3 class="viaje-quien">${p.titulo}</h3>\n        <p style="font-size:14px;line-height:1.6;">${p.texto}</p>\n        ${dialogoHTML(p.dialogo)}\n      </div>\n      <div class="card">\n        <p style="margin:0 0 10px;font-weight:700;">${p.preg}</p>\n        <div class="options">${p.ops.map(([o], i) => `<button class="opt ${e === i ? "elegida" : ""}" data-crisis-op="${i}" ${e !== undefined ? "disabled" : ""}>${o}</button>`).join("")}</div>\n        ${e !== undefined ? `<div class="feedback ok" style="border-color:var(--blue);background:var(--blue-soft);">${p.ops[e][1]}</div>\n          ${p.nota ? `<p class="nota-chica" style="margin-bottom:10px;">${p.nota}</p>` : ""}\n          <button class="btn block" data-crisis-seguir="1">${c.paso < CRISIS30.length - 1 ? "Seguir ›" : "El final: la caída del patrón oro ›"}</button>` : ""}\n      </div>`;
}

function bindCrisis30U2() {
  const c = state.crisis;
  if (!c) return;
  document.querySelectorAll("[data-crisis-op]").forEach(b => {
    b.onclick = () => {
      c.elig[c.paso] = +b.dataset.crisisOp;
      refreshUnidad();
    };
  });
  document.querySelectorAll("[data-crisis-final]").forEach(b => {
    b.onclick = () => {
      c.final = +b.dataset.crisisFinal;
      refreshUnidad();
    };
  });
  const s = document.querySelector("[data-crisis-seguir]");
  if (s) s.onclick = () => {
    c.paso++;
    refreshUnidad();
    irAlDetalle();
  };
  const r = document.querySelector("[data-crisis-reiniciar]");
  if (r) r.onclick = () => {
    state.crisis = {
      paso: 0,
      elig: {},
      final: undefined
    };
    refreshUnidad();
    irAlDetalle();
  };
}

      } ]
    });
    let msg;
    if (v._ult === "p") {
      msg = `<div class="feedback ok"><strong>Movimiento a lo largo de la curva.</strong> Cambió el precio de la yerba: a un precio más alto conviene producir más, a uno más bajo, menos. La curva quedó quieta; cambió la <em>cantidad ofrecida</em>.</div>`;
    } else {
      const dir = c > c0 ? "a la derecha" : c < c0 ? "a la izquierda" : null;
      msg = dir ? `<div class="feedback bad" style="border-color:var(--ocre);background:var(--ocre-soft);"><strong>Desplazamiento de la curva ${dir}.</strong> Cambió ${nombres[v._ult]}. Ahora, <em>a cualquier precio</em>, los productores ofrecen ${c > c0 ? "más" : "menos"} que antes: cambió la <em>oferta</em>.</div>` : `<div class="feedback ok">Los cambios se compensaron entre sí: la oferta quedó donde estaba.</div>`;
    }
    return g + datos([ [ "Precio", pesos(v.p) ], [ "Cantidad ofrecida", fmt(q) + " mil" ], [ "La curva", movida ? c > c0 ? "se corrió a la derecha" : "se corrió a la izquierda" : "no se movió" ] ]) + msg;
  }
};

const U3_MOVDESP = BANCOS.U3_MOVDESP;

function nuevoEjercicio() {
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const Pe = r(4, 30), b = r(1, 5), d = r(1, 4);
  const Qe = r(Math.max(20, b * 2), 90);
  return {
    Pe: Pe,
    Qe: Qe,
    b: b,
    d: d,
    a: Qe + b * Pe,
    c: Qe - d * Pe,
    resp: null,
    pe: "",
    qe: "",
    verSolucion: false
  };
}

function ecuacion(nombre, cte, coef, signo) {
  const termino = `${coef === 1 ? "" : coef}P`;
  if (signo < 0) return `${nombre} = ${cte} − ${termino}`;
  if (cte === 0) return `${nombre} = ${termino}`;
  return cte > 0 ? `${nombre} = ${cte} + ${termino}` : `${nombre} = −${-cte} + ${termino}`;
}

function renderEquilibrioU3() {
  const e = state.eq || (state.eq = nuevoEjercicio());
  const qd = ecuacion("Qd", e.a, e.b, -1), qs = ecuacion("Qs", e.c, e.d, +1);
  const ok = e.resp && e.resp.pOk && e.resp.qOk;
  const pasos = `\n      <ol class="pasos">\n        <li>En equilibrio, lo que se quiere comprar es igual a lo que se quiere vender: <span class="mono">Qd = Qs</span>.</li>\n        <li><span class="mono">${e.a} − ${e.b}P = ${e.c < 0 ? "−" + -e.c : e.c} + ${e.d}P</span></li>\n        <li>Paso los términos con P a un lado: <span class="mono">${e.a} ${e.c < 0 ? "+ " + -e.c : "− " + e.c} = ${e.d}P + ${e.b}P</span> → <span class="mono">${e.a - e.c} = ${e.b + e.d}P</span></li>\n        <li><span class="mono">Pe = ${e.a - e.c} / ${e.b + e.d} = <strong>${e.Pe}</strong></span></li>\n        <li>Reemplazo en cualquiera de las dos: <span class="mono">Qe = ${e.a} − ${e.b} × ${e.Pe} = <strong>${e.Qe}</strong></span> (y en la oferta da lo mismo: <span class="mono">${e.c} + ${e.d} × ${e.Pe} = ${e.Qe}</span>).</li>\n      </ol>`;
  const g = grafico({
    xmax: Math.ceil(e.Qe * 1.8 / 10) * 10,
    ymax: Math.ceil(Math.max(e.a / e.b, e.Pe * 1.6) / 5) * 5,
    xlabel: "Cantidad",
    ylabel: "Precio",
    series: [ {
      pts: recta(e.a, 0, 0, e.a / e.b),
      color: "var(--blue)",
      label: "D",
      labelEn: [ e.a * .85, e.a / e.b * .15 ]
    }, {
      pts: recta(e.c + e.d * Math.max(0, -e.c / e.d), Math.max(0, -e.c / e.d), e.c + e.d * (e.a / e.b + 20), e.a / e.b + 20),
      color: "var(--ocre)",
      label: "O"
    } ],
    guiasH: [ {
      y: e.Pe,
      x2: e.Qe
    } ],
    guiasV: [ {
      x: e.Qe,
      y2: e.Pe
    } ],
    xticks: [ 0, e.Qe ],
    yticks: [ 0, e.Pe ],
    puntos: [ {
      x: e.Qe,
      y: e.Pe,
      t: `Pe = ${e.Pe} · Qe = ${e.Qe}`
    } ]
  });
  return `\n      <div class="card">\n        <p style="margin:0 0 10px;">Estas son la demanda y la oferta de un mercado. Encontrá el precio y la cantidad de equilibrio.</p>\n        <div class="ecuaciones"><div class="mono">${qd}</div><div class="mono">${qs}</div></div>\n        <div class="eq-inputs">\n          <label>Pe = <input type="number" inputmode="decimal" id="eq-pe" value="${e.pe}"></label>\n          <label>Qe = <input type="number" inputmode="decimal" id="eq-qe" value="${e.qe}"></label>\n        </div>\n        <div class="chips-fila">\n          <button class="btn" data-eq-comprobar="1">Comprobar</button>\n          <button class="btn secondary" data-eq-solucion="1">Ver el paso a paso</button>\n          <button class="btn secondary" data-eq-nuevo="1">Otro ejercicio</button>\n        </div>\n        ${e.resp ? `<div class="feedback ${ok ? "ok" : "bad"}">${ok ? `<strong>¡Bien!</strong> Pe = ${e.Pe} y Qe = ${e.Qe}.` : `${e.resp.pOk ? "El precio está bien" : "El precio no da"}${e.resp.qOk ? " y la cantidad está bien." : e.resp.pOk ? ", pero la cantidad no: reemplazá Pe en cualquiera de las dos ecuaciones." : ". Acordate: en equilibrio Qd = Qs."}`}</div>` : ""}\n      </div>\n      ${e.verSolucion || ok ? `<div class="card">${g}${pasos}</div>` : ""}`;
}

const MONO_CF = 1e3;

function resultadoMonopolio(v) {
  const nat = v.nat === 1, CF = nat ? MONO_CF : 0;
  const r = { Q: 40, P: 60, cf: 20, estado: 0, cierra: false, nota: "" };
  const m = v.med;
  if (m === "pmax") {
    const T = v.tope;
    if (T < 60) {
      if (T < 20) {
        r.Q = 0; r.P = T; r.cierra = true;
        r.nota = `Con un tope de ${pesos(T, 1)}, por debajo del costo de cada unidad, a la empresa no le conviene producir nada. Los consumidores quieren ${fmt(100 - T)} unidades y no hay ninguna: faltante total.`;
      } else {
        r.Q = 100 - T; r.P = T;
      }
    }
  } else if (m === "impuesto") {
    r.Q = (80 - v.t) / 2; r.P = 100 - r.Q; r.estado = v.t * r.Q; r.cf = 20 + v.t;
  } else if (m === "subsidio") {
    r.Q = (80 + v.s) / 2; r.P = 100 - r.Q; r.estado = -v.s * r.Q; r.cf = 20 - v.s;
  } else if (m === "competencia") {
    r.Q = 80 * v.N / (v.N + 1); r.P = 20 + 80 / (v.N + 1);
  } else if (m === "importar") {
    if (v.pint < 60) { r.P = v.pint; r.Q = 100 - v.pint; }
  }
  const firmas = m === "competencia" ? v.N : 1;
  let G = (r.P - r.cf) * r.Q - CF * firmas;
  if (m === "ganancias") { r.estado = Math.max(0, G) * v.alic / 100; G -= r.estado; }
  if (nat && m === "pmax" && !r.cierra && G < -.5) {
    if (v.cubre === 1) { r.estado += G; r.cubierto = -G; G = 0; }
    else { r.cierra = true; r.nota = `Con el precio en ${pesos(v.tope, 1)} la empresa no cubre el costo fijo: perdería ${pesos(-G)}. Cierra y el barrio se queda sin gas.`; }
  }
  if (r.cierra) { r.Q = 0; G = 0; r.estado = 0; }
  r.G = Math.abs(G) < .5 ? 0 : G;
  r.EC = r.Q > 0 ? 100 * r.Q - r.Q * r.Q / 2 - r.P * r.Q : 0;
  r.W = r.EC + r.G + r.estado;
  r.Wmax = nat ? 3200 - MONO_CF : 3200;
  r.perdida = Math.max(0, r.Wmax - r.W);
  r.firmas = firmas;
  r.Gfirma = G / firmas;
  return r;
}

  const juego = UNIRES[clave];
  if (!juego.datos.length) return `<div class="card"><p class="sub" style="margin:0;">Esta actividad no tiene casos cargados.</p></div>`;
  if (!state.unirs) state.unirs = {};
  const u = state.unirs[clave] || (state.unirs[clave] = nuevoUnir(clave));
  state.unir = u;
  const N = u.grupos.length;
  const porId = id => u.grupos.find(f => f.id === id);

function dibujarFlechasUnir() {
  const cont = document.getElementById("unir"), svg = document.getElementById("unir-svg");
  const u = state.unir;
  if (!cont || !svg || !u) return;
  const base = cont.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${base.width} ${base.height}`);
  let s = `<defs>\n      <marker id="punta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--blue)"/></marker>\n      <marker id="punta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--verde)"/></marker>\n      <marker id="punta-rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rojo)"/></marker></defs>`;
  Object.entries(u.pares).forEach(([caso, falla]) => {
    const a = cont.querySelector(`[data-unir-caso="${caso}"]`), b = cont.querySelector(`[data-unir-falla="${falla}"]`);
    if (!a || !b) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.right - base.left, y1 = ra.top + ra.height / 2 - base.top;
    const x2 = rb.left - base.left - 2, y2 = rb.top + rb.height / 2 - base.top;
    const col = !u.comprobado ? "azul" : caso === falla ? "verde" : "rojo";
    const css = {
      azul: "var(--blue)",
      verde: "var(--verde)",
      rojo: "var(--rojo)"
    }[col];
    const curva = `M${x1},${y1} L${x2},${y2}`;
    s += `<path d="${curva}" style="fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round"/><path d="${curva}" style="fill:none;stroke:${css};stroke-width:2.4" marker-end="url(#punta-${col})"/><circle cx="${x1}" cy="${y1}" r="3.5" style="fill:${css}"/>`;
  });
  svg.innerHTML = s;
}

window.addEventListener("resize", () => {
  if (document.getElementById("unir")) dibujarFlechasUnir();
});

function bindUnirU3() {
  const u = state.unir;
  if (!document.getElementById("unir")) return;
  document.querySelectorAll("[data-unir-caso]").forEach(b => {
    b.onclick = () => {
      u.sel = u.sel === b.dataset.unirCaso ? null : b.dataset.unirCaso;
      refreshUnidad();
    };
  });
  document.querySelectorAll("[data-unir-falla]").forEach(b => {
    b.onclick = () => {
      if (!u.sel) return;
      const falla = b.dataset.unirFalla;
      Object.keys(u.pares).forEach(c => {
        if (u.pares[c] === falla) delete u.pares[c];
      });
      u.pares[u.sel] = falla;
      u.sel = null;
      refreshUnidad();
    };
  });
  const comp = document.querySelector("[data-unir-comprobar]");
  if (comp) comp.onclick = () => {
    u.comprobado = true;
    refreshUnidad();
  };
  const borr = document.querySelector("[data-unir-borrar]");
  if (borr) borr.onclick = () => {
    u.pares = {};
    u.sel = null;
    refreshUnidad();
  };
  const nuevo = document.querySelector("[data-unir-nuevo]");
  if (nuevo) nuevo.onclick = () => {
    state.unirs[u.clave] = nuevoUnir(u.clave);
    refreshUnidad();
  };
  requestAnimationFrame(dibujarFlechasUnir);
}

function limonesRonda(k, ronda) {
  let precio = k * 6e3;
  for (let r = 0; r < ronda; r++) precio = k * (2e3 + Math.min(precio, 1e4)) / 2;
  return Math.min(precio, 1e4 * k);
}

const SIM_CRUZ = {
  id: "cruz",
  intro: `<p class="sub" style="margin:0;">Una economía cerrada y sin Estado. Las familias consumen una parte fija de lo que ganan (c) más un consumo autónomo; las empresas invierten un monto dado. Arriba, la cruz keynesiana; abajo, <strong>la misma historia contada con el ahorro</strong>.</p>`,
  inicial: {
    C0: 20,
    I: 30,
    c: .6
  },
  sliders: [ {
    k: "C0",
    label: "Consumo autónomo (el que se hace aunque el ingreso sea cero)",
    min: 0,
    max: 50,
    step: 5,
    fmt: v => pesos(v)
  }, {
    k: "I",
    label: "Inversión",
    min: 10,
    max: 60,
    step: 5,
    fmt: v => pesos(v)
  }, {
    k: "c",
    label: "Propensión marginal a consumir (c)",
    min: .1,
    max: .8,
    step: .05,
    fmt: v => fmt(v, 2)
  } ],
  dibujar(v) {
    const A = v.C0 + v.I, Y = A / (1 - v.c), S = -v.C0 + (1 - v.c) * Y;
    const g1 = grafico({
      H: 230,
      xmax: 600,
      ymax: 600,
      xlabel: "Producto e ingreso (Y)",
      ylabel: "Gasto planeado (DA)",
      xticks: [ 0, 200, 400, 600 ],
      yticks: [ 0, 300, 600 ],
      series: [ {
        pts: recta(0, 0, 600, 600),
        color: "var(--ink-soft)",
        dash: "4 4",
        w: 1.4,
        label: "DA = Y",
        labelEn: [ 520, 520 ],
        dy: 14
      }, {
        pts: recta(0, A, 600, A + v.c * 600),
        color: "var(--blue)",
        label: "DA = C + I"
      } ],
      guiasV: [ {
        x: Y,
        y2: Y
      } ],
      puntos: [ {
        x: Y,
        y: Y,
        t: "Y* = " + pesos(Y)
      } ]
    });
    const ymax = Math.max(120, Math.ceil(v.I * 2.2 / 20) * 20);
    const g2 = grafico({
      H: 200,
      xmax: 600,
      ymin: -60,
      ymax: ymax,
      xlabel: "Producto e ingreso (Y)",
      ylabel: "Ahorro e inversión",
      xticks: [ 0, 200, 400, 600 ],
      yticks: [ 0, ymax / 2 ],
      series: [ {
        pts: recta(0, -v.C0, 600, -v.C0 + (1 - v.c) * 600),
        color: "var(--verde)",
        label: "Ahorro (S)"
      }, {
        pts: recta(0, v.I, 600, v.I),
        color: "var(--ocre)",
        label: "Inversión (I)",
        labelEn: [ 40, v.I ],
        dy: -6
      } ],
      guiasV: [ {
        x: Y,
        y1: -60,
        y2: S
      } ],
      puntos: [ {
        x: Y,
        y: S,
        color: "var(--verde)",
        t: "S = I"
      } ]
    });
    return g1 + g2 + datos([ [ "Multiplicador 1/(1 − c)", fmt(1 / (1 - v.c), 2) ], [ "Producto de equilibrio", pesos(Y, 1) ], [ "Consumo en equilibrio", pesos(v.C0 + v.c * Y, 1) ], [ "Ahorro en equilibrio", pesos(S, 1) ] ]) + `<div class="feedback ok">Los dos gráficos dicen lo mismo: el producto se ubica donde el gasto planeado es igual a lo producido (arriba) o, lo que es equivalente, donde <strong>lo que las familias quieren ahorrar es igual a lo que las empresas quieren invertir</strong> (abajo). Fijate que en equilibrio el ahorro es siempre igual a la inversión: <strong>${pesos(S, 1)}</strong>.</div>\n      <p class="nota-chica"><strong>La paradoja del ahorro.</strong> Bajá el consumo autónomo (las familias deciden ahorrar más a cualquier nivel de ingreso): la curva de ahorro sube, pero el producto cae, y el ahorro total en equilibrio… termina igual, porque sigue siendo igual a la inversión. Lo que es virtuoso para una familia puede no serlo para la economía entera.</p>`;
  }
};

const SIM_MULTI = {
  id: "multi",
  intro: `<p class="sub" style="margin:0;">Diez personas en fila. Lo que una gasta es el ingreso de la siguiente. Cada una, de cada peso que recibe, ahorra una parte, <em>importa</em> otra si la economía es abierta, y gasta el resto en el país. Mirá cómo se va apagando la cadena.</p>`,
  inicial: {
    ab: "no",
    pol: "gasto",
    c: .8,
    m: .1,
    monto: 100
  },
  toggles: [ {
    k: "ab",
    label: "Economía",
    opciones: [ [ "no", "Cerrada" ], [ "si", "Abierta" ] ]
  }, {
    k: "pol",
    label: "Medida",
    opciones: [ [ "gasto", "Sube el gasto público" ], [ "imp", "Bajan los impuestos" ] ]
  } ],
  sliders: [ {
    k: "c",
    label: "Propensión marginal a consumir (c)",
    min: .5,
    max: .9,
    step: .05,
    fmt: v => fmt(v, 2)
  }, {
    k: "m",
    label: "Propensión marginal a importar (m)",
    min: .05,
    max: .3,
    step: .05,
    fmt: v => fmt(v, 2),
    si: v => v.ab === "si"
  }, {
    k: "monto",
    label: "Tamaño de la medida",
    min: 10,
    max: 200,
    step: 10,
    fmt: v => pesos(v)
  } ],
  dibujar(v) {
    const m = v.ab === "si" ? v.m : 0;
    const dom = v.c - m;
    const filas = [];
    let recibe = v.monto, pib = 0;
    for (let i = 1; i <= 10; i++) {
      const esContribuyente = v.pol === "imp" && i === 1;
      if (!esContribuyente) pib += recibe;
      filas.push({
        i: i,
        recibe: recibe,
        ahorra: (1 - v.c) * recibe,
        importa: m * recibe,
        gasta: dom * recibe,
        pib: pib,
        esContribuyente: esContribuyente
      });
      recibe = dom * recibe;
    }
    const mult = v.pol === "gasto" ? 1 / (1 - dom) : dom / (1 - dom);
    const total = mult * v.monto;
    const multG = 1 / (1 - dom), multT = dom / (1 - dom);
    const barras = filas.map(f => ({
      x: f.i,
      y: f.recibe,
      ancho: .65,
      color: f.esContribuyente ? "var(--ocre)" : "var(--blue)",
      abajo: String(f.i)
    }));
    const g = grafico({
      H: 190,
      xmin: .3,
      xmax: 10.7,
      ymax: v.monto * 1.1,
      ylabel: "Lo que recibe cada persona ($)",
      yticks: [ 0, v.monto ],
      barras: barras
    });
    const tabla = `\n        <table class="tabla-datos">\n          <tr><th>Persona</th><th>Recibe</th><th>Ahorra</th>${m ? "<th>Importa</th>" : ""}<th>Gasta en el país</th><th>PIB acumulado</th></tr>\n          ${filas.map(f => `<tr${f.esContribuyente ? ' class="destacada"' : ""}><td>${f.i}${f.esContribuyente ? " (le bajan los impuestos)" : ""}</td><td>${pesos(f.recibe, 1)}</td><td>${pesos(f.ahorra, 1)}</td>${m ? `<td>${pesos(f.importa, 1)}</td>` : ""}<td>${pesos(f.gasta, 1)}</td><td>${pesos(f.pib, 1)}</td></tr>`).join("")}\n        </table>`;
    const formula = v.pol === "gasto" ? `1 / (1 − c${m ? " + m" : ""}) = 1 / (1 − ${fmt(v.c, 2)}${m ? " + " + fmt(m, 2) : ""}) = <strong>${fmt(mult, 2)}</strong>` : `(c${m ? " − m" : ""}) / (1 − c${m ? " + m" : ""}) = <strong>${fmt(mult, 2)}</strong>`;
    return g + tabla + datos([ [ "PIB generado con 10 personas", pesos(filas[9].pib, 1) ], [ "Si la cadena siguiera para siempre", pesos(total, 1) ], [ "Multiplicador", fmt(mult, 2) ] ]) + `<div class="feedback ok">\n        Multiplicador ${v.pol === "gasto" ? "del gasto" : "de los impuestos"}: ${formula}.\n        ${v.pol === "imp" ? `<br><br><strong>Por qué la baja de impuestos multiplica menos:</strong> la persona 1 no produjo nada; recibió plata. Lo primero que se produce es lo que ella gasta en el país, y ahí ya se perdió lo que ahorró${m ? " y lo que importó" : ""}. Con el mismo monto, subir el gasto genera ${pesos(multG * v.monto, 1)} y bajar impuestos ${pesos(multT * v.monto, 1)}.` : ""}\n        ${m ? `<br><br><strong>Economía abierta:</strong> cada vuelta pierde también lo que se importa: ese gasto genera ingreso, pero en otro país. Por eso el multiplicador es menor que en una economía cerrada.` : ""}\n      </div>`;
  }
};

const INTRO_BRECHAS = `\n    <p style="margin:0 0 8px;">En toda economía lo que se invierte tiene que financiarse con algún ahorro. El modelo de las tres brechas lo ordena así:</p>\n    <ul class="lista-teoria">\n      <li><strong>Ahorro neto privado</strong> = ahorro privado − inversión privada (S − I)</li>\n      <li><strong>Ahorro neto público</strong> = impuestos − gasto público (T − G): superávit si es positivo, déficit si es negativo</li>\n      <li><strong>Ahorro neto externo</strong> = importaciones − exportaciones (M − X): es positivo cuando el país tiene déficit de cuenta corriente, es decir, cuando el resto del mundo le está prestando</li>\n    </ul>\n    <p style="margin:8px 0 0;">Y la identidad: <strong>las tres suman cero</strong>. Si una brecha es negativa, alguna otra tiene que ser positiva para taparla.</p>\n    <p class="nota-chica" style="margin-top:8px;">Los datos son aproximados, en % del PIB, redondeados a partir de estadísticas oficiales y de organismos internacionales.</p>`;

const U4_BRECHAS_REAL = BANCOS.U4_BRECHAS_REAL;

const SIM_BRECHAS = {
  id: "brechas3",
  intro: `<p class="sub" style="margin:0;">Mové el ahorro y la inversión privados, los impuestos y el gasto público (todo en % del PIB). El ahorro neto externo no lo movés vos: se ajusta solo, porque las tres brechas tienen que sumar cero.</p>`,
  inicial: {
    S: 20,
    I: 20,
    T: 30,
    G: 30
  },
  sliders: [ {
    k: "S",
    label: "Ahorro privado (S)",

  }, {
    k: "I",

  }, {
    k: "T",
    label: "Impuestos (T)",

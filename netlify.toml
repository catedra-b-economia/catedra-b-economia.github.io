# En cada publicación se corre publicar.js, que arma dist/ con el contenido cifrado.
[build]
  command = "node publicar.js"
  publish = "dist"

# El contenido se edita seguido: que el navegador siempre consulte si hay versión nueva.
[[headers]]
  for = "/contenido/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
